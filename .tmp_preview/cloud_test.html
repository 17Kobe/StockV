<!doctype html>
<html><body style="margin:0;background:#2a4a63;display:flex;gap:10px;padding:10px;flex-wrap:wrap">
<canvas id="old0" width="192" height="120" style="background:#2a4a63"></canvas>
<canvas id="old1" width="192" height="120" style="background:#2a4a63"></canvas>
<canvas id="new0" width="192" height="120" style="background:#2a4a63"></canvas>
<canvas id="new1" width="192" height="120" style="background:#2a4a63"></canvas>
<script>
const STORM_W = 192, STORM_H = 120;
const rng = (seed) => {
  let s = seed >>> 0;
  return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
};
function mk(seed, side, baseFill, shadowCol, shadowA, underCol, underA) {
  const r = rng(seed),
      j = (v) => v + (r() - 0.5) * 0.05,
      s = (v) => v * (0.88 + r() * 0.24),
      tx = side > 0 ? 0.4 : 0.6;
  const puffs = [
      [j(tx), j(0.46), s(0.32)],
      [j(tx + side * 0.25), j(0.57), s(0.23)],
      [j(tx - side * 0.21), j(0.62), s(0.19)],
      [j(tx + side * 0.37), j(0.66), s(0.13)],
      [j(tx + side * 0.05), j(0.68), s(0.2)],
  ];
  const c = document.createElement('canvas');
  c.width = STORM_W; c.height = STORM_H;
  const g = c.getContext('2d');
  const P = puffs.map(([x, y, rr]) => {
      const R = rr * STORM_H;
      return [Math.max(R * 1.15 + 2, Math.min(STORM_W - R * 1.15 - 2, x * STORM_W)), y * STORM_H, R];
  });
  const bumps = [];
  for (const [x, y, R] of P) {
      if (R < STORM_H * 0.17) continue;
      const n = 2 + Math.floor(r() * 3);
      for (let i = 0; i < n; i++) {
          const a = -Math.PI * (0.12 + r() * 0.76),
              br = R * (0.22 + r() * 0.2);
          bumps.push([x + Math.cos(a) * R * 0.86, Math.max(br + 1, y + Math.sin(a) * R * 0.86), br]);
      }
  }
  g.fillStyle = baseFill;
  g.beginPath();
  for (const [x, y, rr] of P.concat(bumps)) {
      g.moveTo(x + rr, y);
      g.arc(x, y, rr, 0, Math.PI * 2);
  }
  g.fill();
  g.globalCompositeOperation = 'source-atop';
  const sky = g.createLinearGradient(0, 0, 0, STORM_H);
  sky.addColorStop(0, 'rgba(150,156,180,.55)');
  sky.addColorStop(0.55, 'rgba(150,156,180,0)');
  g.fillStyle = sky;
  g.fillRect(0, 0, STORM_W, STORM_H);
  for (const [x, y, rr] of P) {
      const gr = g.createRadialGradient(x - rr * 0.15, y - rr * 0.6, 0, x - rr * 0.1, y - rr * 0.35, rr * 1.15);
      gr.addColorStop(0, 'rgba(172,178,200,.42)');
      gr.addColorStop(0.5, 'rgba(128,134,158,.18)');
      gr.addColorStop(1, 'rgba(128,134,158,0)');
      g.fillStyle = gr;
      g.fillRect(x - rr * 1.2, y - rr * 1.6, rr * 2.4, rr * 2.6);
      const sh = g.createRadialGradient(x, y + rr * 0.9, 0, x, y + rr * 0.9, rr * 0.9);
      sh.addColorStop(0, `rgba(${shadowCol},${shadowA})`);
      sh.addColorStop(1, `rgba(${shadowCol},0)`);
      g.fillStyle = sh;
      g.fillRect(x - rr, y, rr * 2, rr * 1.8);
  }
  const under = g.createLinearGradient(0, STORM_H * 0.45, 0, STORM_H);
  under.addColorStop(0, `rgba(${underCol},0)`);
  under.addColorStop(1, `rgba(${underCol},${underA})`);
  g.fillStyle = under;
  g.fillRect(0, 0, STORM_W, STORM_H);
  return c;
}
// 舊版（過黑）
document.getElementById('old0').getContext('2d').drawImage(mk(11, 1, '#4a4f66', '30,33,50', .35, '16,18,30', .7), 0, 0);
document.getElementById('old1').getContext('2d').drawImage(mk(29, -1, '#4a4f66', '30,33,50', .35, '16,18,30', .7), 0, 0);
// 新版（調亮）
document.getElementById('new0').getContext('2d').drawImage(mk(11, 1, '#5f6580', '46,50,70', .28, '40,43,62', .55), 0, 0);
document.getElementById('new1').getContext('2d').drawImage(mk(29, -1, '#5f6580', '46,50,70', .28, '40,43,62', .55), 0, 0);
</script>
</body></html>
