  <!-- 黃河壺口瀑布（2.5D）：寬闊的土黃色黃河在褐色岩床上一路收束（亮色水紋往壺口匯聚、閃動），到壺口突然整片跌入一道窄而深的岩槽——端壁是一整面翻騰的黃色水簾（水紋閃動），槽邊也有水流溢下，槽底是翻滾的黃水與白浪，從底座右側缺口流出；壺口升起一團團白色水霧（動畫）。底座側面是分層的褐色岩層，遠岸是層層疊疊的黃土高原土崖，近岸是較低的岩階與小水窪。光源左上，不描邊 -->
