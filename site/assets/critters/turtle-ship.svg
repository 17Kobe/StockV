  <linearGradient id="tshHull" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9a5a34"/>
    <stop offset="1" stop-color="#5a3018"/>
  </linearGradient>
  <linearGradient id="tshHead" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd860"/>
    <stop offset="1" stop-color="#d88a20"/>
  </linearGradient>
  <linearGradient id="tshSea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4aa8d8"/>
    <stop offset="1" stop-color="#1e6aa0"/>
  </linearGradient>
  <clipPath id="tshRoofClip"><path d="M17 45 Q17 25 40 23 Q68 21 69 44 Z"/></clipPath>
</defs>
