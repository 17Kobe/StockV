<!-- 李舜臣龜船（거북선 Geobukseon）：船首朝左，龍頭張口吐煙；龜甲狀裝甲屋頂布滿鐵刺與六角龜甲紋 -->
<!-- 木造船身紅褐色、黃色飾邊與砲門，下方一排船槳划入海中，船隻隨波浪輕輕起伏 -->
