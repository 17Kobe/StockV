    <stop offset="0" stop-color="#e2b46a"/>
    <stop offset="1" stop-color="#a87634"/>
  </linearGradient>
  <linearGradient id="gshThatchSide" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c8944a"/>
    <stop offset="1" stop-color="#8a5a24"/>
  </linearGradient>
  <linearGradient id="gshMtn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5a8a74"/>
    <stop offset="1" stop-color="#2e5a40"/>
  </linearGradient>
  <linearGradient id="gshField" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9ad860"/>
    <stop offset="1" stop-color="#5a9a34"/>
  </linearGradient>
</defs>
<!-- 後方小山與杉林 -->
