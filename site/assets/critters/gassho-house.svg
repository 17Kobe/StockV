<!-- 白川鄉合掌村 Shirakawa-go：三棟大小不同的合掌造民家，極陡的厚茅草三角屋頂幾乎觸地，屋脊覆雪 -->
<!-- 山牆露出深色木樑與白色障子窗，四周是綠色梯田水田，後方有杉林與小雪山 -->
<defs>
