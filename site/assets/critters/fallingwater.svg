<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 流水別墅（萊特設計）：米色混凝土懸挑露台層層交錯，砂岩石砌煙囪直立，櫻桃紅細窗框的帶狀窗；房子就蓋在瀑布上，溪水從屋下岩階瀉落，四周綠樹環繞 -->
  <defs>
    <linearGradient id="fwSlab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3dc"/>
      <stop offset=".6" stop-color="#e8dcbc"/>
      <stop offset="1" stop-color="#bfae88"/>
    </linearGradient>
    <linearGradient id="fwStone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8b88a"/>
      <stop offset="1" stop-color="#9c7a52"/>
    </linearGradient>
    <linearGradient id="fwGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4a52"/>
      <stop offset="1" stop-color="#1e262c"/>
    </linearGradient>
    <linearGradient id="fwFall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe2ee"/>
    </linearGradient>
    <linearGradient id="fwRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7a66"/>
      <stop offset="1" stop-color="#5a4c3e"/>
    </linearGradient>
    <radialGradient id="fwLeaf" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#8fcc5a"/>
      <stop offset=".6" stop-color="#4f9a38"/>
      <stop offset="1" stop-color="#2c6326"/>
    </radialGradient>
  </defs>

  <!-- 後方樹林 -->
  <g fill="url(#fwLeaf)" stroke="#24502a" stroke-width=".5">
    <circle cx="10" cy="30" r="9"/>
    <circle cx="20" cy="18" r="8"/>
    <circle cx="62" cy="16" r="8"/>
    <circle cx="72" cy="28" r="8"/>
    <circle cx="5" cy="46" r="7"/>
    <circle cx="76" cy="44" r="6"/>
  </g>

  <!-- 岩階 -->
  <path d="M4,58 L16,54 L62,54 L76,57 L76,64 L66,62 L60,66 L20,66 L12,63 L4,66 Z" fill="url(#fwRock)" stroke="#3e3328" stroke-width=".5"/>

  <!-- 溪水：從屋下流出，越過岩階 -->
  <path d="M14,54 L62,54 L62,57 L14,57 Z" fill="#9fd0dc"/>
  <path d="M16,56 L60,56 L60,66 L16,66 Z" fill="url(#fwFall)" stroke="#8cbccb" stroke-width=".4"/>
  <g stroke="#a9d4e2" stroke-width=".6" opacity=".9">
    <path d="M22,57 V65"/><path d="M30,57 V66"/><path d="M38,57 V65"/><path d="M46,57 V66"/><path d="M54,57 V65"/>
    <animate attributeName="opacity" values=".9;.4;.9" dur="1.6s" repeatCount="indefinite"/>
  </g>
  <!-- 下層小瀑布與水潭 -->
  <path d="M12,66 L64,66 L66,70 L10,70 Z" fill="#6a5a48" stroke="#3e3328" stroke-width=".4"/>
  <path d="M20,66 L56,66 L56,72 L20,72 Z" fill="url(#fwFall)"/>
  <path d="M2,72 Q40,68 78,72 L78,77 Q40,80 2,77 Z" fill="#7cbccd" stroke="#4f8fa2" stroke-width=".4"/>
  <g fill="#fff" opacity=".85">
    <ellipse cx="28" cy="72.5" rx="6" ry="1.5"/>
    <ellipse cx="46" cy="72.5" rx="7" ry="1.6"/>
  </g>

  <!-- 砂岩煙囪塔 -->
  <path d="M40,10 L48,10 L48,54 L40,54 Z" fill="url(#fwStone)" stroke="#5e4630" stroke-width=".5"/>
  <g stroke="#7a5c3a" stroke-width=".45" opacity=".85">
    <path d="M40,15 H48 M40,20 H48 M40,25 H48 M40,30 H48 M40,35 H48 M40,40 H48 M40,45 H48 M40,50 H48"/>
    <path d="M44,10 V15 M42,15 V20 M46,20 V25 M43,25 V30 M45,30 V35 M42,35 V40 M46,40 V45 M44,45 V50"/>
  </g>

  <!-- 頂層：帶狀窗＋露台 -->
  <path d="M24,22 H40 V27 H24 Z" fill="url(#fwGlass)"/>
  <g stroke="#a3322a" stroke-width=".6"><path d="M24,22 H40 M24,27 H40 M28,22 V27 M32,22 V27 M36,22 V27"/></g>
  <path d="M20,19 H42 V22 H20 Z" fill="url(#fwSlab)" stroke="#8a7a5a" stroke-width=".5"/>

  <!-- 中層：向右長長懸挑 -->
  <path d="M28,30 H40 V35 H28 Z M48,30 H62 V35 H48 Z" fill="url(#fwGlass)"/>
  <g stroke="#a3322a" stroke-width=".6"><path d="M28,30 H40 M48,30 H62 M32,30 V35 M36,30 V35 M52,30 V35 M56,30 V35 M60,30 V35"/></g>
  <path d="M26,27 H68 V30 H26 Z" fill="url(#fwSlab)" stroke="#8a7a5a" stroke-width=".5"/>
  <path d="M30,35 H72 V39 H30 Z" fill="url(#fwSlab)" stroke="#8a7a5a" stroke-width=".5"/>
  <path d="M30,39 H72 V40 H30 Z" fill="#000" opacity=".2"/>

  <!-- 下層：向左大幅懸挑在瀑布上方 -->
  <path d="M18,42 H40 V47 H18 Z M48,42 H56 V47 H48 Z" fill="url(#fwGlass)"/>
  <g stroke="#a3322a" stroke-width=".6"><path d="M18,42 H40 M48,42 H56 M22,42 V47 M26,42 V47 M30,42 V47 M34,42 V47 M38,42 V47 M52,42 V47"/></g>
  <path d="M10,47 H58 V51.5 H10 Z" fill="url(#fwSlab)" stroke="#8a7a5a" stroke-width=".5"/>
  <path d="M10,51.5 H58 V53 H10 Z" fill="#000" opacity=".25"/>
  <!-- 露台亮邊 -->
  <g stroke="#fffaf0" stroke-width=".5" opacity=".9">
    <path d="M20.5,19.4 H41.5 M26.5,27.4 H67.5 M30.5,35.4 H71.5 M10.5,47.4 H57.5"/>
  </g>

  <!-- 前方樹叢 -->
  <g fill="url(#fwLeaf)" stroke="#24502a" stroke-width=".5">
    <circle cx="6" cy="62" r="5"/>
    <circle cx="74" cy="64" r="5"/>
  </g>
</svg>
