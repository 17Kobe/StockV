<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<!-- 峽灣國家公園（米爾福德峽灣）：陡峭尖聳的麥特峰從深藍峽灣直插而起，對岸峭壁垂下細長白色瀑布，水面倒影與白色遊船 -->
<defs>
  <linearGradient id="fioRock" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a8b0b8"/>
    <stop offset=".5" stop-color="#7a848e"/>
    <stop offset="1" stop-color="#4c545e"/>
  </linearGradient>
  <linearGradient id="fioForest" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4f9a48"/>
    <stop offset=".55" stop-color="#2f6e34"/>
    <stop offset="1" stop-color="#1c4a26"/>
  </linearGradient>
  <linearGradient id="fioCliff" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5c6670"/>
    <stop offset="1" stop-color="#8a949e"/>
  </linearGradient>
  <linearGradient id="fioCliffGreen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3f8440"/>
    <stop offset="1" stop-color="#1e4e28"/>
  </linearGradient>
  <linearGradient id="fioWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f5f8a"/>
    <stop offset="1" stop-color="#173a5c"/>
  </linearGradient>
  <linearGradient id="fioFar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b6c6d6"/>
    <stop offset="1" stop-color="#7c90a6"/>
  </linearGradient>
  <linearGradient id="fioFall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#cfe8f6"/>
  </linearGradient>
</defs>
<!-- 遠方淡藍山脊 -->
<path d="M0,56 L0,34 L8,28 L14,36 L20,56 Z" fill="url(#fioFar)" opacity="0.85"/>
<path d="M38,56 L46,30 L52,38 L56,56 Z" fill="url(#fioFar)" opacity="0.8"/>
<!-- 峽灣水面 -->
<rect x="0" y="56" width="80" height="24" fill="url(#fioWater)"/>
<!-- 麥特峰倒影 -->
<path d="M8,56 L27,77 L46,56 Z" fill="#0e2a44" opacity="0.45"/>
<path d="M50,56 L80,56 L80,72 L58,64 Z" fill="#0e2a44" opacity="0.35"/>
<!-- 麥特峰：陡峭尖峰 -->
<path d="M8,56 Q16,44 19,30 Q23,16 27,4 Q31,16 34,28 Q38,44 46,56 Z" fill="url(#fioRock)" stroke="#353c44" stroke-width="0.6" stroke-linejoin="round"/>
<!-- 山脊陰影面 -->
<path d="M27,4 Q28,20 30,32 Q33,46 38,56 L46,56 Q38,44 34,28 Q31,16 27,4 Z" fill="#3e464f" opacity="0.55"/>
<!-- 岩壁裂紋 -->
<path d="M23,20 L25,26 M30,18 L29,25 M21,32 L24,36 M32,34 L31,40" stroke="#4a525c" stroke-width="0.5" fill="none" stroke-linecap="round"/>
<!-- 峰頂積雪 -->
<path d="M27,4 Q28.6,9 30,13 L28.6,12 L27.6,14 L26.2,11.5 L24.6,13 Q25.8,8 27,4 Z" fill="#ffffff" stroke="#b8c8d6" stroke-width="0.4"/>
<path d="M22.5,22 l1.2,-2 l0.8,2.6 Z M31.5,21 l0.9,-1.8 l0.8,2.4 Z" fill="#eef4fa"/>
<!-- 下坡森林 -->
<path d="M8,56 Q13,49 16,42 Q20,45 22,41 Q25,46 28,42 Q31,46 34,41 Q37,45 39,42 Q42,50 46,56 Z" fill="url(#fioForest)" stroke="#173e20" stroke-width="0.5" stroke-linejoin="round"/>
<!-- 右側峭壁 -->
<path d="M80,56 L54,56 Q56,44 55,32 Q56,20 60,14 L68,12 L80,16 Z" fill="url(#fioCliff)" stroke="#353c44" stroke-width="0.6" stroke-linejoin="round"/>
<path d="M60,14 L64,13 L62,16 Z M70,12.5 L76,14.5 L72,15 Z" fill="#ffffff"/>
<path d="M80,56 L54,56 Q56,50 56,44 Q60,47 62,43 Q66,47 70,42 Q74,46 80,42 Z" fill="url(#fioCliffGreen)" stroke="#173e20" stroke-width="0.5" stroke-linejoin="round"/>
<!-- 細長瀑布 -->
<path d="M63.5,16 Q62.6,30 63,56" fill="none" stroke="url(#fioFall)" stroke-width="1.8" stroke-linecap="round"/>
<path d="M63.5,18 Q62.8,30 63.2,54" fill="none" stroke="#9fd2ee" stroke-width="0.6" stroke-dasharray="2 3">
  <animate attributeName="stroke-dashoffset" values="0;-10" dur="1s" repeatCount="indefinite"/>
</path>
<!-- 瀑布底部水霧 -->
<ellipse cx="63" cy="56.5" rx="3.6" ry="1.4" fill="#ffffff" opacity="0.75">
  <animate attributeName="opacity" values="0.75;0.4;0.75" dur="2s" repeatCount="indefinite"/>
</ellipse>
<!-- 水面波光 -->
<path d="M4,62 h7 M48,64 h8 M18,70 h6 M62,74 h9" stroke="#8ec4e6" stroke-width="0.6" stroke-linecap="round" opacity="0.7">
  <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
</path>
<!-- 白色遊船 -->
<g transform="translate(44,66)">
  <path d="M-6,0 L7,0 L5,2.6 L-5,2.6 Z" fill="#ffffff" stroke="#4a5a6a" stroke-width="0.4"/>
  <rect x="-3" y="-2.2" width="6" height="2.2" fill="#f2f6fa" stroke="#4a5a6a" stroke-width="0.4"/>
  <rect x="-2.2" y="-1.6" width="4.4" height="0.8" fill="#3a5a7a"/>
  <rect x="0.2" y="-3.6" width="1.2" height="1.4" fill="#d24a3a"/>
  <path d="M-7,3.4 q2,-0.6 4,0 M4,3.4 q2,-0.6 4,0" stroke="#bfe0f2" stroke-width="0.4" fill="none"/>
</g>
</svg>
