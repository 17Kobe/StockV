<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <!-- 富士山經典的藍紫色山體，左邊受光 -->
    <linearGradient id="fjBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c84c8"/>
      <stop offset=".5" stop-color="#4a5fa6"/>
      <stop offset="1" stop-color="#2f3c78"/>
    </linearGradient>
    <linearGradient id="fjBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4f92" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a6a4a"/>
    </linearGradient>
    <linearGradient id="fjSnow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#bccbe6"/>
    </linearGradient>
  </defs>
  <!-- 富士山：兩側往內凹的優美曲線、寬大的山腳、山頂是平的火山口（不是尖的三角形）；
       山頂積雪往下拉出一條條雪溝；山腰一條雲帶，山腳有櫻花樹 -->
  <!-- 山體：凹曲線斜坡 + 平頂 -->
  <path d="M2 72 Q20 66 28 46 Q33 28 35 16 L45 16 Q47 28 52 46 Q60 66 78 72Z" fill="url(#fjBody)" stroke="#26306a" stroke-width=".6" stroke-linejoin="round"/>
  <!-- 山腳往下漸漸變成綠色的森林 -->
  <path d="M2 72 Q20 66 28 46 L52 46 Q60 66 78 72Z" fill="url(#fjBase)" opacity=".85"/>
  <!-- 右側背光面 -->
  <path d="M40 16 L45 16 Q47 28 52 46 Q60 66 78 72 L56 72 Q48 56 44 36Z" fill="#1e2858" opacity=".25"/>
  <!-- 山頂積雪：平頂，下緣一條條往下延伸的雪溝 -->
  <path d="M35 16 L45 16 Q46.4 23 48.6 32
           L47.4 31 L47 38 L45.6 30 L44.6 35 L43.6 29 L42.4 36 L41.4 28.6 L40 34 L38.8 28.6 L37.6 35.6 L36.6 29 L35.4 34 L34.4 30 L33 37 L32.6 31 L31.4 32
           Q33.6 23 35 16Z" fill="url(#fjSnow)" stroke="#a8bcdc" stroke-width=".4" stroke-linejoin="round"/>
  <!-- 火山口的凹口 -->
  <path d="M36.4 16 Q38 17.6 40 16.8 Q42 17.6 43.6 16" stroke="#9fb2d6" stroke-width=".7" fill="none"/>
  <!-- 雪面受光 -->
  <path d="M35.6 18 Q34.4 24 33 30" stroke="#ffffff" stroke-width="1" fill="none" opacity=".9" stroke-linecap="round"/>
  <!-- 山腰的雲帶 -->
  <g>
    <path d="M14 54 Q18 50 24 52 Q28 48 34 51 Q40 48 46 51 Q52 49 56 53 Q62 52 64 56 Q40 60 14 54Z" fill="#ffffff" opacity=".85"/>
    <animateTransform attributeName="transform" type="translate" values="-2 0; 2 0; -2 0" dur="6s" repeatCount="indefinite"/>
  </g>
  <!-- 山腳的櫻花樹 -->
  <g>
    <rect x="9.4" y="68" width="1.2" height="5" fill="#6a4030"/>
    <circle cx="10" cy="66" r="4" fill="#ffb7d0"/><circle cx="8" cy="64.6" r="2.4" fill="#ffd2e2"/>
    <rect x="69.4" y="68" width="1.2" height="5" fill="#6a4030"/>
    <circle cx="70" cy="66" r="4" fill="#ffb7d0"/><circle cx="68" cy="64.6" r="2.4" fill="#ffd2e2"/>
    <rect x="16.4" y="70" width="1" height="3.6" fill="#6a4030"/>
    <circle cx="17" cy="68.6" r="2.8" fill="#ff9fc0"/>
  </g>
  <!-- 地面 -->
  <path d="M0 72 Q40 69 80 72 V76 Q40 74 0 76Z" fill="#3f8a4a"/>
</svg>
