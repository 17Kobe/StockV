<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 雪豹（面向左）：淡煙灰米白毛色，身上黑色梅花環斑、頭部實心小斑，粗長蓬鬆的尾巴低垂後上翹，短圓耳、灰綠眼、大毛掌 -->
  <defs>
    <linearGradient id="slFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d6cc"/>
      <stop offset="0.45" stop-color="#ece9e0"/>
      <stop offset="1" stop-color="#f8f6f0"/>
    </linearGradient>
    <linearGradient id="slFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4c0b4"/>
      <stop offset="1" stop-color="#a9a597"/>
    </linearGradient>
    <radialGradient id="slHead" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f6f4ee"/>
      <stop offset="1" stop-color="#d2cec2"/>
    </radialGradient>
    <radialGradient id="slEye" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#d4e2c2"/>
      <stop offset="1" stop-color="#8aa48a"/>
    </radialGradient>
  </defs>

  <!-- 地面陰影與雪石 -->
  <ellipse cx="42" cy="70.5" rx="31" ry="3" fill="#000" opacity="0.18"/>
  
  

  <!-- 遠側腿 -->
  <path d="M27 46 L33 46 L32.6 64 Q34.6 68.6 30.6 69 L26 69 Q24 68 26.6 64Z" fill="url(#slFar)" stroke="#6a665c" stroke-width="0.5"/>
  <path d="M50 46 L56 46 L56.6 64 Q58.6 68.6 54.6 69 L50 69 Q48 68 50.6 64Z" fill="url(#slFar)" stroke="#6a665c" stroke-width="0.5"/>

  <!-- 尾巴（低垂再上翹，輕擺） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 57 40;-4 57 40;0 57 40;3 57 40;0 57 40" dur="4s" repeatCount="indefinite"/>
    <path d="M57 39 Q68 42 69.6 55 Q70.4 66.4 73.6 64.8 Q76.8 62.4 75.4 50.6" fill="none" stroke="#6a665c" stroke-width="10.2" stroke-linecap="round"/>
    <path d="M57 39 Q68 42 69.6 55 Q70.4 66.4 73.6 64.8 Q76.8 62.4 75.4 50.6" fill="none" stroke="#e6e2d8" stroke-width="9" stroke-linecap="round"/>
    <path d="M57 39 Q68 42 69.6 55 Q70.4 66.4 73.6 64.8 Q76.8 62.4 75.4 50.6" fill="none" stroke="#3a3833" stroke-width="9" stroke-dasharray="1.3 4.4" stroke-dashoffset="-6" opacity="0.8"/>
    <path d="M59 40 Q67.6 44 68.6 54" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <circle cx="75.3" cy="50.2" r="3.9" fill="#3a3833"/>
  </g>

  <!-- 身體 -->
  <path d="M20 33 Q28 26.6 42 28.4 Q54 27.4 59.6 34 Q63.4 42 58.4 49 Q52 53.4 44 51.6 Q34 53 26 50.6 Q17.6 46 20 33Z" fill="url(#slFur)" stroke="#6a665c" stroke-width="0.6"/>
  <!-- 背部煙灰色 -->
  <path d="M24 31 Q34 27.6 44 29 Q54 28.4 58 33.4 Q48 32 36 33.6 Q28 34.4 24 31Z" fill="#b6b2a6" opacity="0.55"/>

  <!-- 近側後腿 -->
  <path d="M48.6 37 Q61.6 35 61 48 L59.6 61 Q59.4 64.6 62 66.4 Q63.6 69.6 59.6 69.6 L53.6 69.6 Q50.6 69 52.6 64.6 L51.4 53 Q46.6 45 48.6 37Z" fill="url(#slFur)" stroke="#6a665c" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- 近側前腿 -->
  <path d="M18.6 40 Q27.6 38 28.6 47 L28.4 63.4 Q31.4 66.4 29.6 69.4 L20.4 69.4 Q16.6 68.4 19.6 64 L19.4 50 Q16.6 45 18.6 40Z" fill="url(#slFur)" stroke="#6a665c" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- 大毛掌趾線 -->
  <g stroke="#8a8578" stroke-width="0.45" stroke-linecap="round">
    <line x1="22.6" y1="67.4" x2="22.6" y2="69.2"/><line x1="25.6" y1="67.4" x2="25.6" y2="69.2"/>
    <line x1="56" y1="67.6" x2="56" y2="69.4"/><line x1="58.8" y1="67.6" x2="58.8" y2="69.4"/>
  </g>

  <!-- 梅花環斑 -->
  <g fill="#cfcabb" stroke="#33312c" stroke-width="0.95">
    <circle cx="30" cy="36" r="2.1"/>
    <circle cx="37" cy="33.6" r="2"/>
    <circle cx="44" cy="35.4" r="2.2"/>
    <circle cx="51" cy="33.4" r="1.9"/>
    <circle cx="34.4" cy="42" r="2.2"/>
    <circle cx="41.6" cy="42.6" r="2"/>
    <circle cx="27.6" cy="43.6" r="1.7"/>
    <circle cx="55" cy="41" r="2"/>
    <circle cx="53.6" cy="48.4" r="1.6"/>
    <circle cx="23.4" cy="45.6" r="1.4"/>
    <circle cx="56.6" cy="56" r="1.3"/>
    <circle cx="23.6" cy="54" r="1.2"/>
  </g>
  <g fill="#33312c">
    <circle cx="47.6" cy="47" r="0.9"/>
    <circle cx="38" cy="48.4" r="0.8"/>
    <circle cx="24.6" cy="59" r="0.7"/>
    <circle cx="55.4" cy="61.6" r="0.7"/>
    <circle cx="57.6" cy="38" r="0.8"/>
  </g>

  <!-- 頭部 -->
  <path d="M8.2 25.6 Q8 21.2 11.6 21.6 Q13.6 22.4 13.4 25Z" fill="#cfcabb" stroke="#4a4740" stroke-width="0.6"/>
  <path d="M17.4 24.6 Q18.6 20.8 21.8 22.4 Q23.2 24.6 21.6 26.6Z" fill="#cfcabb" stroke="#4a4740" stroke-width="0.6"/>
  <path d="M9.4 24.8 Q10 23 11.6 23.4" fill="none" stroke="#4a4740" stroke-width="0.9" stroke-linecap="round"/>
  <ellipse cx="15.4" cy="30.4" rx="8.8" ry="7.6" fill="url(#slHead)" stroke="#6a665c" stroke-width="0.6"/>
  <!-- 口鼻 -->
  <ellipse cx="10.6" cy="34.4" rx="4.6" ry="3.2" fill="#f8f6f0" stroke="#8a8578" stroke-width="0.4"/>
  <path d="M7 32.4 Q8.8 31.4 10.4 32.4 Q9.4 34 8.6 34 Q7.6 33.8 7 32.4Z" fill="#9a7a78" stroke="#4a3a38" stroke-width="0.35"/>
  <path d="M8.7 34 L8.7 35.4 Q7.4 36.6 6.4 35.8 M8.7 35.4 Q10 36.6 11.4 35.8" fill="none" stroke="#4a4740" stroke-width="0.45" stroke-linecap="round"/>
  <!-- 眼睛 -->
  <ellipse cx="10.4" cy="29" rx="1.3" ry="1.1" fill="url(#slEye)" stroke="#2a2a26" stroke-width="0.45"/>
  <ellipse cx="16" cy="28.6" rx="1.5" ry="1.25" fill="url(#slEye)" stroke="#2a2a26" stroke-width="0.45"/>
  <ellipse cx="10.4" cy="29.1" rx="0.35" ry="0.8" fill="#1a1a18"/>
  <ellipse cx="16" cy="28.7" rx="0.4" ry="0.9" fill="#1a1a18"/>
  <circle cx="10" cy="28.6" r="0.3" fill="#fff"/>
  <circle cx="15.5" cy="28.1" r="0.35" fill="#fff"/>
  <!-- 頭部實心斑點 -->
  <g fill="#33312c">
    <circle cx="13" cy="25.2" r="0.6"/><circle cx="15.6" cy="24.6" r="0.6"/><circle cx="18.2" cy="25.6" r="0.55"/>
    <circle cx="20.4" cy="28.6" r="0.7"/><circle cx="21.6" cy="31.6" r="0.6"/><circle cx="19.8" cy="34.4" r="0.65"/>
    <circle cx="13.6" cy="31.6" r="0.4"/><circle cx="17.4" cy="32.6" r="0.45"/><circle cx="14.4" cy="26.8" r="0.4"/>
  </g>
  <!-- 鬍鬚 -->
  <g stroke="#8a8578" stroke-width="0.3" stroke-linecap="round" opacity="0.8">
    <line x1="9" y1="35" x2="3.4" y2="34.2"/><line x1="9" y1="35.6" x2="3.8" y2="36.6"/>
  </g>
</svg>
