<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 東北虎（朝左走）：淡橙色厚毛、白色胸腹與臉頰鬃毛、黑色雙尖條紋、眼上白斑、黑色環紋尾巴，腳下有小雪堆 -->
  <defs>
    <linearGradient id="stgFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcdcaa"/><stop offset=".6" stop-color="#f0b574"/><stop offset="1" stop-color="#dd9a56"/>
    </linearGradient>
    <linearGradient id="stgFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a060"/><stop offset="1" stop-color="#c0803f"/>
    </linearGradient>
    <radialGradient id="stgHead" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fde3b8"/><stop offset=".7" stop-color="#f0b574"/><stop offset="1" stop-color="#dd9a56"/>
    </radialGradient>
    <linearGradient id="stgWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e2dc"/>
    </linearGradient>
    <linearGradient id="stgSnow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe0ee"/>
    </linearGradient>
  </defs>

  <!-- 地面陰影 -->
  <ellipse cx="42" cy="70" rx="31" ry="3.6" fill="#000" opacity=".18"/>

  <!-- 尾巴（擺動） -->
  <g>
    <path d="M63,42 Q74,44 74,34 Q74,27 69,23" fill="none" stroke="#5a3214" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M63,42 Q74,44 74,34 Q74,27 69,23" fill="none" stroke="#f0b574" stroke-width="4.2" stroke-linecap="round"/>
    <g stroke="#1b1612" stroke-width="1.6" stroke-linecap="round">
      <path d="M70,40.6 L72.6,42.6"/><path d="M72.2,35.6 L76,36"/><path d="M71.8,30.4 L75.6,29.2"/>
    </g>
    <path d="M71.6,27 Q70.6,24.4 69,23" fill="none" stroke="#1b1612" stroke-width="4.2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" values="0 63 42;-6 63 42;0 63 42" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- 遠側腿 -->
  <g fill="url(#stgFar)" stroke="#5a3214" stroke-width=".6">
    <path d="M31,50 L37,50 L37,67 Q34,68.4 30.4,67 Z"/>
    <path d="M52,50 L58,50 L58.4,67 Q55,68.4 51.6,67 Z"/>
  </g>
  <g stroke="#1b1612" stroke-width="1.2" stroke-linecap="round">
    <path d="M31.4,56 L34,56.6"/><path d="M52.2,56 L55,56.6"/>
  </g>

  <!-- 身體 -->
  <path d="M25,38 C30,31 50,30 62,34 C70,37 71,50 65,55 C57,60 35,60 28,56 C22,52 21,43 25,38 Z" fill="url(#stgFur)" stroke="#5a3214" stroke-width=".7"/>
  <!-- 白色腹部 -->
  <path d="M27,50 C34,57 54,58 65,52 C64,55 63,56 62,56.6 C54,60.6 35,60.6 28.4,56.6 Z" fill="url(#stgWhite)"/>

  <!-- 身體條紋（黑色、雙尖、不規則） -->
  <g fill="#1b1612">
    <path d="M33,32.6 Q31.6,38 33.6,43 Q34.6,38 35,32.2 Z"/>
    <path d="M39,31.4 Q37.4,39 39.8,46 Q41,39 41.2,31.2 Z"/>
    <path d="M45.4,31 Q43.6,37 46,42.4 Q46.6,37 47.6,31 Z"/>
    <path d="M45.6,44.4 Q45.4,48 47,51 Q47.4,47.6 46.8,44.4 Z"/>
    <path d="M51.6,31.4 Q49.6,39 52.4,47 Q53.4,39 53.8,31.6 Z"/>
    <path d="M57.6,32.6 Q55.8,38 58,43.4 Q59,38 59.8,33 Z"/>
    <path d="M62.6,35 Q61.2,40 63.8,45 Q64.4,40 64.6,35.6 Z"/>
    <path d="M38,47.6 Q37.6,51 39,54 Q39.6,51 39.2,47.6 Z"/>
    <path d="M28,40 Q27.2,44 28.6,48 Q29.6,44 29.6,39.4 Z"/>
  </g>

  <!-- 近側後腿（大腿＋小腿） -->
  <path d="M55,40 C62,38 68,44 66,52 L63.8,67 Q60,68.6 56.4,67 L56.6,56 C53,53 52,44 55,40 Z" fill="url(#stgFur)" stroke="#5a3214" stroke-width=".7"/>
  <g fill="#1b1612">
    <path d="M58,42 Q60.6,45 59.6,50 Q62.4,46 61.4,41.4 Z"/>
    <path d="M63,45 Q64.4,47.4 63.6,51 Q65.6,48 65.4,45 Z"/>
    <path d="M57,58.6 L61,59.4 L57,60.4 Z"/>
    <path d="M57,62.4 L62,63 L57,64 Z"/>
  </g>

  <!-- 近側前腿 -->
  <path d="M23,46 C26,44 31,45 31.6,49 L31,67 Q27,68.6 22.6,67 Z" fill="url(#stgFur)" stroke="#5a3214" stroke-width=".7"/>
  <g fill="#1b1612">
    <path d="M23,56 L27,56.8 L23,57.8 Z"/>
    <path d="M23,60.6 L26.6,61.2 L23,62.2 Z"/>
  </g>

  <!-- 雪堆（腳邊） -->
  <g fill="url(#stgSnow)" stroke="#a9c3d8" stroke-width=".5">
    <path d="M19,69 Q21,65.4 26,66 Q30,64.6 33.6,67.6 Q34.6,69.6 33,70.4 L20,70.4 Q18.4,70.2 19,69 Z"/>
    <path d="M50,69 Q52,65.6 56,66.4 Q60,64.8 64.4,67.4 Q66,69.6 64.4,70.4 L51,70.4 Q49.4,70.2 50,69 Z"/>
  </g>

  <!-- 頭部 -->
  <g>
    <!-- 耳朵（圓形，背面黑色帶白斑） -->
    <circle cx="11.4" cy="27.4" r="4.2" fill="#1b1612" stroke="#5a3214" stroke-width=".5"/>
    <circle cx="11.2" cy="27.6" r="1.6" fill="#fff"/>
    <circle cx="24" cy="26" r="4.4" fill="#1b1612" stroke="#5a3214" stroke-width=".5"/>
    <circle cx="24.2" cy="26.2" r="1.7" fill="#fff"/>
    <!-- 臉頰白色鬃毛 -->
    <path d="M7,40 Q5,47 10,50 L12.6,52 L14.6,50.4 L17.4,52.6 L19.6,50.4 L22.6,52 L24.4,49 L27.4,49.6 L27.6,46 L30,44 Q29,38 26,36 Z" fill="url(#stgWhite)" stroke="#9b8f80" stroke-width=".5"/>
    <!-- 頭 -->
    <ellipse cx="17.6" cy="37.4" rx="11.4" ry="10.6" fill="url(#stgHead)" stroke="#5a3214" stroke-width=".7"/>
    <!-- 臉頰條紋 -->
    <g fill="#1b1612">
      <path d="M28.6,37 L23.4,39 L28.8,39.6 Z"/>
      <path d="M28.2,41.6 L23.6,42.4 L27.6,43.8 Z"/>
      <path d="M6.6,37.4 L10,39 L6.4,39.8 Z"/>
    </g>
    <!-- 額頭條紋（王字樣） -->
    <g fill="#1b1612">
      <path d="M13,28.4 Q16,27.4 19.4,28.4 Q16,29.4 13,28.4 Z"/>
      <path d="M12.4,30.8 Q16,29.8 20,30.8 Q16,31.8 12.4,30.8 Z"/>
      <path d="M15.6,27.6 L16.4,27.6 L16.6,32 L15.4,32 Z"/>
    </g>
    <!-- 眼上白斑 -->
    <ellipse cx="11.6" cy="33" rx="2.4" ry="1.4" fill="#fff"/>
    <ellipse cx="20.4" cy="33" rx="2.4" ry="1.4" fill="#fff"/>
    <!-- 眼睛（眨眼） -->
    <g fill="#d9b23a" stroke="#1b1612" stroke-width=".6">
      <ellipse cx="11.8" cy="35.6" rx="1.7" ry="1.5"><animate attributeName="ry" values="1.5;1.5;.2;1.5" keyTimes="0;.92;.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="20.2" cy="35.6" rx="1.7" ry="1.5"><animate attributeName="ry" values="1.5;1.5;.2;1.5" keyTimes="0;.92;.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
    </g>
    <g fill="#1b1612">
      <ellipse cx="11.6" cy="35.6" rx=".7" ry=".8"><animate attributeName="ry" values=".8;.8;.1;.8" keyTimes="0;.92;.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="20" cy="35.6" rx=".7" ry=".8"><animate attributeName="ry" values=".8;.8;.1;.8" keyTimes="0;.92;.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
    </g>
    <!-- 白色口鼻 -->
    <path d="M9,40 Q9,37.6 12,38 L16,38.6 Q20,37.6 22,40 Q23,45 16,46.4 Q8.6,45.6 9,40 Z" fill="url(#stgWhite)" stroke="#9b8f80" stroke-width=".5"/>
    <!-- 鼻子 -->
    <path d="M13.4,38.4 L18.6,38.4 Q18,41 16,41.6 Q14,41 13.4,38.4 Z" fill="#c8746a" stroke="#5a3214" stroke-width=".5"/>
    <path d="M16,41.6 L16,43 M16,43 Q14.4,44.4 12.8,43.4 M16,43 Q17.6,44.4 19.2,43.4" fill="none" stroke="#3a2416" stroke-width=".6" stroke-linecap="round"/>
    <g fill="#3a2416"><circle cx="12.4" cy="41.4" r=".35"/><circle cx="19.6" cy="41.4" r=".35"/></g>
  </g>
</svg>
