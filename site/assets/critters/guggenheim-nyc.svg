<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <!-- 圓柱體的明暗：左邊受光、右邊背光 -->
  <linearGradient id="ggBand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.45" stop-color="#f1eee4"/>
    <stop offset="1" stop-color="#b9b4a4"/>
  </linearGradient>
  <linearGradient id="ggGap" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5d6f80"/>
    <stop offset="1" stop-color="#2a3644"/>
  </linearGradient>
  <linearGradient id="ggTower" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e9dcc2"/>
    <stop offset="1" stop-color="#b9a988"/>
  </linearGradient>
</defs>
<!-- 紐約古根漢美術館：萊特設計的白色螺旋，像倒過來的階梯蛋糕，一圈比一圈寬；圈與圈之間是深色的帶狀窗。
     右後方是米色的方形塔樓，左邊是較小的圓形副館 -->
<ellipse cx="40" cy="73" rx="34" ry="2.6" fill="#000" opacity="0.18"/>
<!-- 後方塔樓 -->
<rect x="52" y="20" width="20" height="52" fill="url(#ggTower)" stroke="#8c7d60" stroke-width="0.5"/>
<g stroke="#8c7d60" stroke-width="0.35" opacity="0.7">
  <line x1="52" y1="28" x2="72" y2="28"/><line x1="52" y1="36" x2="72" y2="36"/>
  <line x1="52" y1="44" x2="72" y2="44"/><line x1="52" y1="52" x2="72" y2="52"/>
  <line x1="52" y1="60" x2="72" y2="60"/>
</g>
<!-- 左邊的小圓館 -->
<path d="M6 72 V58 Q6 55 15 55 Q24 55 24 58 V72 Z" fill="url(#ggBand)" stroke="#9a9484" stroke-width="0.5"/>
<path d="M6 61 Q15 63 24 61" stroke="#3a4756" stroke-width="1.6" fill="none"/>
<!-- 主螺旋：由下往上四圈，每圈都更寬（兩端畫成橢圓弧，看起來是圓柱） -->
<!-- 第 1 圈（最下、最窄） -->
<path d="M22 72 V64 Q22 61.5 38 61.5 Q54 61.5 54 64 V72 Z" fill="url(#ggBand)" stroke="#9a9484" stroke-width="0.5"/>
<path d="M22 64 Q38 66.6 54 64 L54 62.6 Q38 65 22 62.6 Z" fill="url(#ggGap)"/>
<!-- 第 2 圈 -->
<path d="M20 61.5 V53 Q20 50.2 38 50.2 Q56 50.2 56 53 V61.5 Q38 64.2 20 61.5 Z" fill="url(#ggBand)" stroke="#9a9484" stroke-width="0.5"/>
<path d="M20 53 Q38 55.8 56 53 L56 51.4 Q38 54.2 20 51.4 Z" fill="url(#ggGap)"/>
<!-- 第 3 圈 -->
<path d="M18 50.2 V41.4 Q18 38.4 38 38.4 Q58 38.4 58 41.4 V50.2 Q38 53 18 50.2 Z" fill="url(#ggBand)" stroke="#9a9484" stroke-width="0.5"/>
<path d="M18 41.4 Q38 44.4 58 41.4 L58 39.8 Q38 42.8 18 39.8 Z" fill="url(#ggGap)"/>
<!-- 第 4 圈（最上、最寬） -->
<path d="M16 38.4 V29.6 Q16 26.4 38 26.4 Q60 26.4 60 29.6 V38.4 Q38 41.4 16 38.4 Z" fill="url(#ggBand)" stroke="#9a9484" stroke-width="0.5"/>
<!-- 頂上的玻璃天窗 -->
<path d="M28 27.4 Q28 22 38 21.6 Q48 22 48 27.4 Q38 28.8 28 27.4 Z" fill="#a9c6d8" stroke="#6f8a9c" stroke-width="0.5"/>
<path d="M33 22.6 V27.9 M38 21.6 V28.2 M43 22.6 V27.9" stroke="#6f8a9c" stroke-width="0.4"/>
<!-- 每圈左側的受光高光 -->
<path d="M18 31 V37 M20 42.6 V48.6 M22 54.4 V60 M24 65.4 V71" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
<!-- 入口 -->
<rect x="33" y="67" width="10" height="5" fill="#2f3b48"/>
</svg>
