<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="mmTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee0c0"/>
      <stop offset=".55" stop-color="#1fa59a"/>
      <stop offset="1" stop-color="#0f6a74"/>
    </linearGradient>
    <linearGradient id="mmFin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff0d4"/>
      <stop offset="1" stop-color="#2aa6a0"/>
    </linearGradient>
    <radialGradient id="mmSkin" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe2cc"/>
      <stop offset="1" stop-color="#f2b896"/>
    </radialGradient>
    <linearGradient id="mmHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a3a"/>
      <stop offset="1" stop-color="#c8341e"/>
    </linearGradient>
    <linearGradient id="mmRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9a8e"/>
      <stop offset="1" stop-color="#5c5e58"/>
    </linearGradient>
  </defs>
  <!-- 美人魚：坐在海中礁石上，長長的紅髮、貝殼上衣、藍綠色魚尾在水面上翹起來 -->
  <!-- 礁石 -->
  <path d="M10 70 Q12 58 24 56 Q34 52 44 56 Q54 58 56 70Z" fill="url(#mmRock)" stroke="#45463f" stroke-width=".6"/>
  <path d="M16 62 Q24 58 32 60" stroke="#c4c4b8" stroke-width="1.2" fill="none" opacity=".6" stroke-linecap="round"/>
  <!-- 魚尾：從腰往右下彎、尾鰭在水面上翹起 -->
  <path d="M30 50 Q26 60 36 64 Q50 68 58 62 Q62 58 64 52 L67 54 Q66 62 60 67 Q48 74 34 70 Q22 66 24 52Z" fill="url(#mmTail)" stroke="#0c5560" stroke-width=".7"/>
  <!-- 鱗片 -->
  <g fill="none" stroke="#bff7ea" stroke-width=".6" opacity=".75">
    <path d="M30 58 q2 2 4 0 q2 2 4 0 q2 2 4 0"/>
    <path d="M34 63 q2 2 4 0 q2 2 4 0 q2 2 4 0 q2 2 4 0"/>
    <path d="M44 67 q2 1.6 4 0 q2 1.6 4 0"/>
  </g>
  <!-- 尾鰭 -->
  <path d="M64 52 Q66 40 74 36 Q72 46 70 50 Q78 48 80 54 Q72 56 67 54Z" fill="url(#mmFin)" stroke="#0c5560" stroke-width=".7">
    <animateTransform attributeName="transform" type="rotate" values="-6 65 53; 6 65 53; -6 65 53" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- 身體 -->
  <path d="M28 36 Q27 44 30 52 L38 52 Q41 44 39 36Z" fill="url(#mmSkin)" stroke="#d29070" stroke-width=".5"/>
  <!-- 貝殼上衣 -->
  <path d="M28.6 38 Q30.6 35 33 38 Q32 41 28.6 38Z M34 38 Q36.4 35 38.6 38 Q35.6 41 34 38Z" fill="#c78cf0" stroke="#8a52b8" stroke-width=".5"/>
  <!-- 手臂：一手撐在礁石上，一手揮手 -->
  <path d="M28.5 38 Q24 44 22 52" stroke="url(#mmSkin)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g>
    <path d="M38.5 37 Q44 32 45 26" stroke="url(#mmSkin)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="45" cy="25" r="1.9" fill="#ffd7bd"/>
    <animateTransform attributeName="transform" type="rotate" values="-8 39 37; 8 39 37; -8 39 37" dur="1.6s" repeatCount="indefinite"/>
  </g>
  <!-- 頭髮（後面的長髮披到腰） -->
  <path d="M25 24 Q22 34 24 46 Q26 50 29 46 Q27 38 29 30Z" fill="url(#mmHair)"/>
  <path d="M41 24 Q44 32 42 42 Q40 44 39 40 Q40 32 38 28Z" fill="url(#mmHair)"/>
  <!-- 臉 -->
  <ellipse cx="33.5" cy="26" rx="6.6" ry="7.2" fill="url(#mmSkin)" stroke="#d29070" stroke-width=".5"/>
  <!-- 瀏海 -->
  <path d="M26.6 26 Q26 17 33.5 17 Q41 17 40.6 25 Q38 21 34 22 Q36 20 33 19.6 Q30 22 26.6 26Z" fill="url(#mmHair)"/>
  <!-- 五官：大眼睛、腮紅、微笑 -->
  <ellipse cx="31" cy="27" rx="1.15" ry="1.5" fill="#1d3a5a"/>
  <ellipse cx="36" cy="27" rx="1.15" ry="1.5" fill="#1d3a5a"/>
  <circle cx="31.4" cy="26.4" r=".45" fill="#fff"/>
  <circle cx="36.4" cy="26.4" r=".45" fill="#fff"/>
  <ellipse cx="29.6" cy="30" rx="1.3" ry=".8" fill="#ff8a8a" opacity=".55"/>
  <ellipse cx="37.4" cy="30" rx="1.3" ry=".8" fill="#ff8a8a" opacity=".55"/>
  <path d="M32 30.6 Q33.5 32 35 30.6" stroke="#b04a4a" stroke-width=".7" fill="none" stroke-linecap="round"/>
  <!-- 髮上的海星 -->
  <path d="M39 19 l.9 1.8 2 .2 -1.5 1.3 .5 2 -1.9 -1 -1.8 1 .5 -2 -1.5 -1.3 2 -.2z" fill="#ffd34a" stroke="#c9902a" stroke-width=".3"/>
  <!-- 海面 -->
  <path d="M0 70 Q10 67 20 70 T40 70 T60 70 T80 70 V80 H0Z" fill="#2f8fc0" opacity=".75"/>
  <path d="M2 72 Q12 69.6 22 72 M44 72 Q54 69.6 64 72" stroke="#d6f2ff" stroke-width=".8" fill="none" opacity=".7">
    <animate attributeName="opacity" values=".3;.8;.3" dur="2.4s" repeatCount="indefinite"/>
  </path>
</svg>
