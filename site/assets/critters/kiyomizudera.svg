<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 京都清水寺：懸造的木造「清水舞台」由多根木柱與橫樑格架撐起，台上本堂為檜皮葺大屋頂，四周秋楓紅葉，背景小朱紅三重塔 -->
  <defs>
    <linearGradient id="kyHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa64a"/>
      <stop offset="1" stop-color="#2f5e26"/>
    </linearGradient>
    <linearGradient id="kyRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7464"/>
      <stop offset="0.6" stop-color="#5e4b3f"/>
      <stop offset="1" stop-color="#3b2e27"/>
    </linearGradient>
    <linearGradient id="kyWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3a46c"/>
      <stop offset="1" stop-color="#9a6a3c"/>
    </linearGradient>
    <linearGradient id="kyPillar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98450"/>
      <stop offset="1" stop-color="#7a5230"/>
    </linearGradient>
    <linearGradient id="kyVerm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f05a3a"/>
      <stop offset="1" stop-color="#b8321e"/>
    </linearGradient>
    <radialGradient id="kyMaple" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="0.6" stop-color="#e2452a"/>
      <stop offset="1" stop-color="#a8251a"/>
    </radialGradient>
    <radialGradient id="kyMaple2" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#e57d22"/>
    </radialGradient>
    <radialGradient id="kyGreen" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#7cc25a"/>
      <stop offset="1" stop-color="#3a7a2e"/>
    </radialGradient>
  </defs>

  <!-- 地面陰影 -->
  <ellipse cx="40" cy="74" rx="37" ry="4" fill="#000" opacity="0.18"/>

  <!-- 背景三重塔 -->
  <g stroke="#3b1a12" stroke-width="0.4" stroke-linejoin="round">
    <line x1="71" y1="3" x2="71" y2="9" stroke="#c9a13a" stroke-width="0.8"/>
    <rect x="68.6" y="10" width="4.8" height="3.4" fill="url(#kyVerm)"/>
    <path d="M65.2 10.6 Q71 7.6 76.8 10.6 Q71 9.9 65.2 10.6Z" fill="#4a3a30"/>
    <rect x="68.2" y="14.6" width="5.6" height="3.6" fill="url(#kyVerm)"/>
    <path d="M64.4 15.3 Q71 12.2 77.6 15.3 Q71 14.6 64.4 15.3Z" fill="#4a3a30"/>
    <rect x="67.8" y="19.4" width="6.4" height="4" fill="url(#kyVerm)"/>
    <path d="M63.6 20.2 Q71 16.8 78.4 20.2 Q71 19.4 63.6 20.2Z" fill="#4a3a30"/>
  </g>

  <!-- 山坡 -->
  <path d="M30 72 Q46 66 54 56 Q60 44 66 34 Q72 25 79 24 L79 70 Q60 76 30 72Z" fill="url(#kyHill)" stroke="#24481c" stroke-width="0.6"/>
  <!-- 山坡上的樹 -->
  <circle cx="72" cy="30" r="6" fill="url(#kyMaple)" stroke="#7a1c12" stroke-width="0.5"/>
  <circle cx="66" cy="27" r="4.5" fill="url(#kyGreen)" stroke="#2a5a20" stroke-width="0.5"/>

  <!-- 舞台下的懸造木柱格架 -->
  <g>
    <rect x="6" y="41" width="52" height="30" fill="#3a2516" opacity="0.55"/>
    <g fill="url(#kyPillar)" stroke="#4a2e18" stroke-width="0.4">
      <rect x="6.5" y="41" width="2.2" height="30"/>
      <rect x="12.6" y="41" width="2.2" height="30"/>
      <rect x="18.7" y="41" width="2.2" height="30"/>
      <rect x="24.8" y="41" width="2.2" height="30"/>
      <rect x="30.9" y="41" width="2.2" height="30"/>
      <rect x="37" y="41" width="2.2" height="30"/>
      <rect x="43.1" y="41" width="2.2" height="30"/>
      <rect x="49.2" y="41" width="2.2" height="30"/>
      <rect x="55.3" y="41" width="2.2" height="28"/>
    </g>
    <g fill="#c99560" stroke="#4a2e18" stroke-width="0.4">
      <rect x="5.5" y="48" width="53" height="1.6"/>
      <rect x="5.5" y="55" width="53" height="1.6"/>
      <rect x="5.5" y="62" width="53" height="1.6"/>
    </g>
  </g>

  <!-- 舞台地板 -->
  <path d="M3 38.6 L60 38.6 L60 42 L3 42Z" fill="url(#kyWood)" stroke="#5a3a1e" stroke-width="0.5"/>
  <rect x="3" y="41.2" width="57" height="0.8" fill="#6e4524"/>
  <!-- 欄杆 -->
  <g stroke="#6e4524" stroke-width="0.6">
    <line x1="3.5" y1="35.6" x2="3.5" y2="38.6"/>
    <line x1="9" y1="35.6" x2="9" y2="38.6"/>
    <line x1="14.5" y1="35.6" x2="14.5" y2="38.6"/>
  </g>
  <rect x="3" y="35.2" width="12" height="0.9" fill="#c99560" stroke="#6e4524" stroke-width="0.3"/>

  <!-- 本堂牆身 -->
  <rect x="15" y="29" width="46" height="9.6" fill="#f0e2c4" stroke="#6e4524" stroke-width="0.5"/>
  <g fill="#b04026">
    <rect x="15" y="29" width="1.6" height="9.6"/>
    <rect x="24" y="29" width="1.4" height="9.6"/>
    <rect x="32.6" y="29" width="1.4" height="9.6"/>
    <rect x="41.2" y="29" width="1.4" height="9.6"/>
    <rect x="49.8" y="29" width="1.4" height="9.6"/>
    <rect x="59.4" y="29" width="1.6" height="9.6"/>
  </g>
  <g fill="#8a5a32" opacity="0.6">
    <rect x="17.5" y="31" width="5.5" height="7.6"/>
    <rect x="26.4" y="31" width="5.4" height="7.6"/>
    <rect x="35" y="31" width="5.4" height="7.6"/>
    <rect x="43.6" y="31" width="5.4" height="7.6"/>
    <rect x="52.2" y="31" width="6.4" height="7.6"/>
  </g>

  <!-- 檜皮葺大屋頂（入母屋造） -->
  <path d="M8 29.5 Q20 27.6 26 21 L31 13 L45 13 L50 21 Q56 27.6 68 29.5 Q60 31.4 38 31.2 Q16 31.4 8 29.5Z" fill="url(#kyRoof)" stroke="#2a1f1a" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- 山牆（破風） -->
  <path d="M33.2 13.2 L38 9.4 L42.8 13.2 L44 18.6 L32 18.6Z" fill="#7a6252" stroke="#2a1f1a" stroke-width="0.5" stroke-linejoin="round"/>
  <path d="M34.6 14.2 L38 11.4 L41.4 14.2 L41.8 17.6 L34.2 17.6Z" fill="#e8d6b0" opacity="0.85"/>
  <line x1="29" y1="13" x2="47" y2="13" stroke="#2a1f1a" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M12 29 Q24 27.4 29 21" fill="none" stroke="#a89282" stroke-width="0.6" opacity="0.8"/>
  <path d="M8 29.5 Q38 32.6 68 29.5" fill="none" stroke="#1e1612" stroke-width="0.9"/>

  <!-- 左下秋楓 -->
  <circle cx="5" cy="66" r="6" fill="url(#kyMaple)" stroke="#7a1c12" stroke-width="0.5"/>
  <circle cx="12" cy="70" r="5" fill="url(#kyMaple2)" stroke="#9a4a12" stroke-width="0.5"/>
  <circle cx="2.5" cy="72" r="4" fill="url(#kyGreen)" stroke="#2a5a20" stroke-width="0.5"/>
  <!-- 右下秋楓 -->
  <circle cx="62" cy="60" r="6.5" fill="url(#kyMaple)" stroke="#7a1c12" stroke-width="0.5"/>
  <circle cx="72" cy="50" r="6" fill="url(#kyMaple2)" stroke="#9a4a12" stroke-width="0.5"/>
  <circle cx="74" cy="64" r="5.5" fill="url(#kyMaple)" stroke="#7a1c12" stroke-width="0.5"/>
  <circle cx="66" cy="41" r="4.5" fill="url(#kyGreen)" stroke="#2a5a20" stroke-width="0.5"/>
  <circle cx="54" cy="69" r="4.5" fill="url(#kyMaple2)" stroke="#9a4a12" stroke-width="0.5"/>
</svg>
