<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <radialGradient id="bmDome" cx="40%" cy="30%" r="70%">
    <stop offset="0" stop-color="#a8c4d8"/>
    <stop offset="1" stop-color="#6c93ac"/>
  </radialGradient>
  <linearGradient id="bmStone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8e4dc"/>
    <stop offset="1" stop-color="#c0bcb0"/>
  </linearGradient>
</defs>
<!-- 伊斯坦堡歷史區：以藍色清真寺為代表，淺藍色大圓頂＋層層疊的小圓頂＋六座宣禮塔（全球唯一六塔清真寺） -->
<rect x="16" y="44" width="48" height="24" fill="url(#bmStone)" stroke="#8a8676" stroke-width="0.5"/>
<path d="M20,44 Q40,22 60,44 Z" fill="url(#bmDome)" stroke="#4a6478" stroke-width="0.5"/>
<circle cx="30" cy="40" r="4" fill="url(#bmDome)" stroke="#4a6478" stroke-width="0.4"/>
<circle cx="50" cy="40" r="4" fill="url(#bmDome)" stroke="#4a6478" stroke-width="0.4"/>
<circle cx="40" cy="23" r="1.3" fill="#4a6478"/>
<!-- 六座宣禮塔 -->
<g fill="#e8e4dc" stroke="#8a8676" stroke-width="0.4">
  <rect x="4" y="40" width="2.6" height="28"/>
  <polygon points="4,40 5.3,33 6.6,40"/>
  <rect x="11" y="46" width="2.2" height="22"/>
  <polygon points="11,46 12.1,40 13.2,46"/>
  <rect x="66" y="46" width="2.2" height="22"/>
  <polygon points="66,46 67.1,40 68.2,46"/>
  <rect x="73" y="40" width="2.6" height="28"/>
  <polygon points="73,40 74.3,33 75.6,40"/>
</g>
</svg>
