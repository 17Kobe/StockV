  <!-- 阿布辛貝神殿（2.5D）：埃及拉美西斯二世在砂岩山壁上鑿出的神殿，正面四座戴法老頭巾與雙冠的巨大坐像，其中一座的頭掉落在地上，頂端一排狒狒雕飾；中間的入口每隔一段時間被陽光照亮（重現每年兩次陽光照進神殿深處，動畫）。光源左上，不描邊 -->
