  <!-- 玉山（2.5D）：台灣與東北亞最高峰，跟富士山同樣的低多邊形畫法——主峰是寬大的尖錐、左側是尖銳的東峰、右後方是北峰，每座山由下而上分成鐵杉林（綠）、板岩岩壁（暖灰褐）、山頂積雪如玉（白，鋸齒狀交界），主峰頂立著白色主峰石碑，山腳一圈鐵杉，山腰雲海慢慢漂移（動畫）。光源左上，不描邊 -->
