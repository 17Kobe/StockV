  <!-- 港珠澳大橋（2.5D）：一條白色長橋從左下跨越深藍色海面往右上延伸，兩座「中國結」造型的白色斜張橋塔（雙柱、上下橫樑間嵌著金色中國結），扇形斜張鋼索拉住橋面、塔頂航空燈閃爍；橋尾降到右上的人工島，鑽進白色弧形殼體的海底隧道入口，島上有波浪形白屋頂建築與消波塊護岸，橋上車流往來、海面波光閃動（動畫）。光源左上，不描邊 -->
