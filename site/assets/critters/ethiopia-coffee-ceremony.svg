<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 衣索比亞咖啡儀式（2.5D）：鋪滿青草葉（點綴黃色 Meskel 小花）的圓形草墊上，一位 Q 版衣索比亞女性跪坐著，3/4 側臉朝右——辮子頭與後腦髮髻、綠黃頭帶、金耳環與十字架項鍊，穿白色傳統長袍（habesha kemis），前襟直條與裙襬是綠黃紅的 tibeb 彩色邊條，白色 netela 披肩斜披；她右手握著黑陶長頸咖啡壺 Jebena 傾斜倒出一道咖啡細流，流進右前方小木桌（rekebot）上的一排小白杯；左前方小炭爐上長柄淺鍋正在烘豆（炭火閃動），最左邊的陶製香爐冒出白煙（煙霧裊裊上升的動畫）。光源左上，不描邊 -->
