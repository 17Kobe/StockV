<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 地獄之門（達瓦札天然氣坑）：土庫曼平坦沙漠中的圓形大坑，從高處斜看可見橢圓坑緣與內壁，坑底與坑壁布滿無數燃燒的小火焰，橘紅光芒與熱煙往上升，坑緣有小小人影 -->
  <defs>
    <radialGradient id="dvzSand" cx=".45" cy=".4" r=".6">
      <stop offset="0" stop-color="#e3c48e"/>
      <stop offset=".7" stop-color="#c49a62"/>
      <stop offset="1" stop-color="#a07a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dvzRimGlow" cx=".5" cy=".55" r=".5">
      <stop offset=".55" stop-color="#ff8a2a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dvzWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2a18"/>
      <stop offset=".5" stop-color="#a8401c"/>
      <stop offset="1" stop-color="#ff8a24"/>
    </linearGradient>
    <radialGradient id="dvzFloor" cx=".5" cy=".5" r=".55">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset=".45" stop-color="#ffc23a"/>
      <stop offset="1" stop-color="#e2531c"/>
    </radialGradient>
    <linearGradient id="dvzFl" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd94a"/>
      <stop offset=".55" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#d42a10"/>
    </linearGradient>
    <radialGradient id="dvzHaze" cx=".5" cy=".85" r=".6">
      <stop offset="0" stop-color="#ffb04a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/>
    </radialGradient>
    <g id="dvzF">
      <path d="M0 0 C-1.6 -.6 -1.6 -2.8 0 -5 C.4 -3.6 1.6 -3 1.4 -1.4 C1.2 -.4 .7 0 0 0Z" fill="url(#dvzFl)"/>
      <path d="M0 0 C-.8 -.4 -.7 -1.6 0 -2.6 C.6 -1.6 .8 -.4 0 0Z" fill="#fff4b0"/>
    </g>
  </defs>

  <!-- 夜晚沙漠地面 -->
  <ellipse cx="40" cy="52" rx="40" ry="24" fill="url(#dvzSand)"/>
  <path d="M6 60 Q14 57 22 60 M56 66 Q64 63 72 66 M10 44 Q16 42 22 44" fill="none" stroke="#a9824e" stroke-width=".5" opacity=".7"/>

  <!-- 熱氣光暈與煙 -->
  <ellipse cx="40" cy="34" rx="30" ry="22" fill="url(#dvzHaze)">
    <animate attributeName="opacity" values=".8;1;.8" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="#7a6a66" opacity=".35">
    <ellipse cx="34" cy="26" rx="7" ry="3.5">
      <animate attributeName="cy" values="30;20;30" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0;.9" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="47" cy="22" rx="6" ry="3">
      <animate attributeName="cy" values="28;16;28" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="7s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g transform="translate(40 49) scale(1.25) translate(-40 -49)">
  <!-- 坑緣光暈 -->
  <ellipse cx="40" cy="47" rx="31" ry="15" fill="url(#dvzRimGlow)"/>
  <!-- 坑緣（外圈土石） -->
  <ellipse cx="40" cy="47" rx="27" ry="12.5" fill="#8a6038" stroke="#5a3a20" stroke-width=".6"/>
  <!-- 坑洞內：遠側內壁 + 坑底 -->
  <ellipse cx="40" cy="47" rx="25" ry="11" fill="url(#dvzWall)"/>
  <ellipse cx="40" cy="51" rx="19" ry="6.5" fill="url(#dvzFloor)">
    <animate attributeName="opacity" values=".85;1;.9;1;.85" dur="1.6s" repeatCount="indefinite"/>
  </ellipse>
  <!-- 內壁岩層紋 -->
  <path d="M17 44 Q40 34 63 44 M20 41 Q40 33.5 60 41" fill="none" stroke="#3e1a0e" stroke-width=".4" opacity=".6"/>

  <!-- 遠側內壁上的火焰 -->
  <g>
    <animate attributeName="opacity" values="1;.7;1;.85;1" dur="1.3s" repeatCount="indefinite"/>
    <use href="#dvzF" transform="translate(22 45) scale(.55)"/>
    <use href="#dvzF" transform="translate(27 42) scale(.5)"/>
    <use href="#dvzF" transform="translate(32 40.5) scale(.5)"/>
    <use href="#dvzF" transform="translate(38 39.5) scale(.48)"/>
    <use href="#dvzF" transform="translate(44 39.8) scale(.5)"/>
    <use href="#dvzF" transform="translate(50 41) scale(.52)"/>
    <use href="#dvzF" transform="translate(55 42.5) scale(.5)"/>
    <use href="#dvzF" transform="translate(59.5 45) scale(.55)"/>
    <use href="#dvzF" transform="translate(25 46.5) scale(.6)"/>
    <use href="#dvzF" transform="translate(35 43.5) scale(.6)"/>
    <use href="#dvzF" transform="translate(47 43.5) scale(.6)"/>
    <use href="#dvzF" transform="translate(56 46.5) scale(.6)"/>
  </g>
  <!-- 坑底火焰 -->
  <g>
    <animate attributeName="opacity" values=".85;1;.75;1;.85" dur="1s" repeatCount="indefinite"/>
    <use href="#dvzF" transform="translate(26 51) scale(.8)"/>
    <use href="#dvzF" transform="translate(31 49) scale(.85)"/>
    <use href="#dvzF" transform="translate(37 48) scale(.9)"/>
    <use href="#dvzF" transform="translate(43 48.3) scale(.9)"/>
    <use href="#dvzF" transform="translate(49 49) scale(.85)"/>
    <use href="#dvzF" transform="translate(54 51) scale(.8)"/>
    <use href="#dvzF" transform="translate(29 54) scale(.95)"/>
    <use href="#dvzF" transform="translate(35 53) scale(1.05)"/>
    <use href="#dvzF" transform="translate(41 53.5) scale(1.1)"/>
    <use href="#dvzF" transform="translate(47 53) scale(1.05)"/>
    <use href="#dvzF" transform="translate(52.5 54.5) scale(.9)"/>
    <use href="#dvzF" transform="translate(38 56.5) scale(.9)"/>
    <use href="#dvzF" transform="translate(44.5 56.8) scale(.85)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -.6;0 0" dur=".7s" repeatCount="indefinite"/>
    <use href="#dvzF" transform="translate(40 50.5) scale(1.3)"/>
    <use href="#dvzF" transform="translate(33 51) scale(1.1)"/>
    <use href="#dvzF" transform="translate(48 51) scale(1.1)"/>
  </g>

  <!-- 近側坑緣（遮住內壁下緣） -->
  <path d="M13 47 Q14 60 40 60 Q66 60 67 47 Q66 59.5 40 59.5 Q15 59.5 13 47Z" fill="#6e4a2a"/>
  <path d="M13.5 48 Q18 59.6 40 59.6 Q62 59.6 66.5 48 Q64 61.5 40 61.5 Q16 61.5 13.5 48Z" fill="#b48a56" stroke="#5a3a20" stroke-width=".5"/>
  <path d="M20 57.5 Q40 62 60 57.5" fill="none" stroke="#ffb04a" stroke-width=".5" opacity=".6"/>

  </g>
  <!-- 坑緣的小人影 -->
  <g fill="#2a1a12" transform="translate(69 36) scale(.75) translate(-65 -38)">
    <circle cx="64" cy="37.2" r=".8"/><path d="M63.3 38 h1.4 l.3 3 h-2Z"/>
    <circle cx="66.6" cy="38" r=".7"/><path d="M66 38.7 h1.2 l.3 2.7 h-1.8Z"/>
  </g>
</svg>
