<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="ppFur" cx="45%" cy="30%" r="80%">
      <stop offset="0" stop-color="#b07a4c"/>
      <stop offset=".6" stop-color="#7e5030"/>
      <stop offset="1" stop-color="#4e2e18"/>
    </radialGradient>
    <linearGradient id="ppBill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5e66"/>
      <stop offset="1" stop-color="#2a2c32"/>
    </linearGradient>
    <linearGradient id="ppTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a4224"/>
      <stop offset="1" stop-color="#3e2412"/>
    </linearGradient>
    <linearGradient id="ppBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b48a"/>
      <stop offset="1" stop-color="#b08860"/>
    </linearGradient>
  </defs>
  <!-- 鴨嘴獸（朝左）：扁平的灰黑色鴨嘴、圓滾滾的棕色毛皮身體、像海狸一樣又寬又扁的尾巴、有蹼的短腳。
       不畫河：地圖上的海就是水面 -->
  <ellipse cx="42" cy="66" rx="32" ry="3.4" fill="#000" opacity=".18"/>
  <!-- 寬扁的尾巴 -->
  <path d="M60 50 Q72 46 78 52 Q79 58 72 62 Q64 64 58 60Z" fill="url(#ppTail)" stroke="#2a1608" stroke-width=".6"/>
  <path d="M64 52 Q70 52 74 55 M63 56 Q69 57 73 59" stroke="#8a6040" stroke-width=".6" fill="none" opacity=".7"/>
  <!-- 後腳（有蹼） -->
  <path d="M54 58 Q58 64 64 66 L56 67 Q52 64 50 60Z" fill="#3a2a22" stroke="#1a100a" stroke-width=".5"/>
  <!-- 身體：長而扁的橢圓 -->
  <path d="M18 50 Q18 36 36 34 Q56 32 62 46 Q64 58 50 62 Q34 64 24 60 Q18 56 18 50Z" fill="url(#ppFur)" stroke="#3a2010" stroke-width=".8"/>
  <!-- 肚子較淺 -->
  <path d="M24 58 Q38 64 54 58 Q46 62 36 62 Q28 62 24 58Z" fill="url(#ppBelly)" opacity=".85"/>
  <!-- 毛的光澤 -->
  <path d="M28 40 Q38 36 50 38" stroke="#d4a070" stroke-width="1.6" fill="none" opacity=".55" stroke-linecap="round"/>
  <!-- 前腳（有蹼，腳趾張開） -->
  <path d="M26 58 Q22 64 16 66 L18 67 L20 66 L22 67.4 L24 66 L26 67 Q30 64 30 60Z" fill="#3a2a22" stroke="#1a100a" stroke-width=".5"/>
  <!-- 頭 -->
  <path d="M10 46 Q12 38 22 38 Q30 40 30 48 Q28 54 20 54 Q12 54 10 46Z" fill="url(#ppFur)" stroke="#3a2010" stroke-width=".8"/>
  <!-- 鴨嘴：又寬又扁、前端圓圓的 -->
  <path d="M12 44 Q4 42 1 46 Q0 50 4 52 Q10 53 14 50Z" fill="url(#ppBill)" stroke="#16181c" stroke-width=".6"/>
  <path d="M2.6 48.4 Q8 49.4 13 48.6" stroke="#16181c" stroke-width=".6" fill="none"/>
  <circle cx="4" cy="45.6" r=".6" fill="#16181c"/>
  <path d="M3 45.4 Q7 43.6 11 44.6" stroke="#8a8e96" stroke-width=".6" fill="none" opacity=".7"/>
  <!-- 眼睛 -->
  <circle cx="17.6" cy="43.4" r="1.7" fill="#120a06"/>
  <circle cx="17" cy="42.8" r=".6" fill="#fff"/>
  <path d="M15.4 41.4 Q17.6 40.4 19.6 41.6" stroke="#4a2a14" stroke-width=".5" fill="none"/>
  <!-- 水花（游動時） -->
  <g fill="#e4f4ff" opacity=".8">
    <circle cx="6" cy="58" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="72" cy="66" r="1"><animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
