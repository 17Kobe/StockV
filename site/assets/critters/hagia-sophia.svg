<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="hsStone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8c9a0"/>
    <stop offset="1" stop-color="#c49a68"/>
  </linearGradient>
  <radialGradient id="hsDome" cx="40%" cy="30%" r="70%">
    <stop offset="0" stop-color="#d8b890"/>
    <stop offset="1" stop-color="#a87c4c"/>
  </radialGradient>
</defs>
<!-- 聖索菲亞大教堂：磚紅色主體 + 中央大圓頂 + 四座尖細的宣禮塔 -->
<rect x="18" y="42" width="44" height="26" fill="url(#hsStone)" stroke="#7a5230" stroke-width="0.5"/>
<path d="M22,42 Q40,20 58,42 Z" fill="url(#hsDome)" stroke="#6b4a28" stroke-width="0.5"/>
<circle cx="40" cy="21" r="1.4" fill="#6b4a28"/>
<!-- 四座宣禮塔（兩側各兩座，是伊斯坦堡最醒目的識別特徵） -->
<g fill="#d8c8a8" stroke="#8a7650" stroke-width="0.4">
  <rect x="6" y="38" width="3" height="30"/>
  <polygon points="6,38 7.5,30 9,38"/>
  <rect x="13" y="44" width="2.6" height="24"/>
  <polygon points="13,44 14.3,37 15.6,44"/>
  <rect x="64" y="44" width="2.6" height="24"/>
  <polygon points="64,44 65.3,37 66.6,44"/>
  <rect x="71" y="38" width="3" height="30"/>
  <polygon points="71,38 72.5,30 74,38"/>
</g>
</svg>
