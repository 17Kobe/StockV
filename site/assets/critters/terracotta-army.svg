<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 兵馬俑：秦始皇陵一號坑，土黃色坑道與隔牆之間，一排排陶土武士俑整齊列陣；前排三尊較大（側邊髮髻、甲片、雙手交握、表情嚴肅），後排逐漸變小 -->
  <defs>
    <linearGradient id="ta-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87a4a"/><stop offset="1" stop-color="#6e4a2a"/>
    </linearGradient>
    <linearGradient id="ta-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7246"/><stop offset="1" stop-color="#c49866"/>
    </linearGradient>
    <linearGradient id="ta-ridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9b483"/><stop offset="1" stop-color="#a77c4c"/>
    </linearGradient>
    <linearGradient id="ta-clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfab88"/><stop offset="1" stop-color="#93705a"/>
    </linearGradient>
    <linearGradient id="ta-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2416" stop-opacity=".35"/>
    </linearGradient>
    <pattern id="ta-plate" patternUnits="userSpaceOnUse" width="1.8" height="1.5">
      <rect width="1.8" height="1.5" fill="#8c6a52"/>
      <rect x="0.15" y="0.15" width="1.5" height="1.15" rx="0.25" fill="#b8927a"/>
      <circle cx="0.9" cy="0.7" r="0.18" fill="#5a3e2a"/>
    </pattern>
    <!-- 單一武士俑（腳底在 y=0） -->
    <g id="ta-w" stroke="#5a3e2a" stroke-width="0.5" stroke-linejoin="round">
      <ellipse cx="0" cy="0" rx="6.5" ry="1.3" fill="#3a2416" opacity=".3" stroke="none"/>
      <rect x="-3.7" y="-9" width="2.9" height="8.4" rx="0.7" fill="url(#ta-clay)"/>
      <rect x="0.8" y="-9" width="2.9" height="8.4" rx="0.7" fill="url(#ta-clay)"/>
      <path d="M-4.6,-1.4 L-0.6,-1.4 L-0.6,0.2 L-4.8,0.2 Z M0.6,-1.4 L4.6,-1.4 L4.8,0.2 L0.6,0.2 Z" fill="#7a5a44"/>
      <path d="M-5.2,-15 L5.2,-15 L6.1,-7.6 Q0,-6.2 -6.1,-7.6 Z" fill="url(#ta-clay)"/>
      <path d="M-5.8,-21.6 Q0,-23 5.8,-21.6 L5.4,-13.4 Q0,-12.3 -5.4,-13.4 Z" fill="url(#ta-plate)"/>
      <path d="M-5.8,-21.6 Q0,-23 5.8,-21.6 L5.4,-13.4 Q0,-12.3 -5.4,-13.4 Z" fill="url(#ta-shade)" stroke="none"/>
      <path d="M-5.7,-21.4 Q-8.2,-20.6 -7.9,-17 L-7.1,-14.2 Q-4,-13.2 -1.1,-14.4 L-1.2,-16.5 Q-3.8,-16 -5,-16.8 Z" fill="url(#ta-clay)"/>
      <path d="M5.7,-21.4 Q8.2,-20.6 7.9,-17 L7.1,-14.2 Q4,-13.2 1.1,-14.4 L1.2,-16.5 Q3.8,-16 5,-16.8 Z" fill="url(#ta-clay)"/>
      <ellipse cx="0" cy="-15.4" rx="1.9" ry="1.5" fill="#c09a7c"/>
      <ellipse cx="0" cy="-21.9" rx="2.7" ry="1" fill="#a9856a"/>
      <ellipse cx="-3.1" cy="-24.8" rx="0.6" ry="1" fill="#b8927a"/>
      <ellipse cx="3.1" cy="-24.8" rx="0.6" ry="1" fill="#b8927a"/>
      <ellipse cx="0" cy="-24.9" rx="3" ry="3.4" fill="url(#ta-clay)"/>
      <path d="M-3,-25.4 Q-3.3,-28.9 0,-29 Q3.3,-28.9 3,-25.4 Q1.5,-27.1 0,-27 Q-1.5,-27.1 -3,-25.4 Z" fill="#6e5040"/>
      <circle cx="2.4" cy="-29.1" r="1.6" fill="#6e5040"/>
      <path d="M1.4,-28.3 L3.1,-28.7" stroke-width="0.35"/>
      <path d="M-2.1,-25.7 L-0.5,-25.1 M2.1,-25.7 L0.5,-25.1" stroke-width="0.45"/>
      <circle cx="-1.2" cy="-24.5" r="0.35" fill="#3a2416" stroke="none"/>
      <circle cx="1.2" cy="-24.5" r="0.35" fill="#3a2416" stroke="none"/>
      <path d="M-1.5,-22.9 Q-0.7,-23.6 0,-23.1 Q0.7,-23.6 1.5,-22.9" fill="none" stroke-width="0.4"/>
    </g>
  </defs>

  <!-- 坑壁與坑底 -->
  <path d="M3,31 Q40,23 77,31 L77,39 Q40,33 3,39 Z" fill="url(#ta-wall)" stroke="#5a3a1e" stroke-width="0.6"/>
  <path d="M3,31 Q40,23 77,31" fill="none" stroke="#d2a874" stroke-width="0.8"/>
  <path d="M3,39 Q40,33 77,39 L79,75 Q40,80 1,75 Z" fill="url(#ta-floor)" stroke="#5a3a1e" stroke-width="0.6"/>
  <!-- 隔牆（透視） -->
  <g fill="url(#ta-ridge)" stroke="#7a5430" stroke-width="0.4">
    <path d="M16.3,37.6 L17.9,37.4 L8.5,77 L3.5,76.6 Z"/>
    <path d="M31.8,36.4 L33.4,36.3 L31.5,78.2 L26.5,78 Z"/>
    <path d="M46.6,36.3 L48.2,36.4 L53.5,78 L48.5,78.2 Z"/>
    <path d="M62.1,37.4 L63.7,37.6 L76.5,76.6 L71.5,77 Z"/>
  </g>

  <!-- 後排 -->
  <g>
    <use href="#ta-w" transform="translate(10.5,44) scale(.36)"/>
    <use href="#ta-w" transform="translate(21.5,44) scale(.36)"/>
    <use href="#ta-w" transform="translate(27.8,44) scale(.36)"/>
    <use href="#ta-w" transform="translate(37,44) scale(.36)"/>
    <use href="#ta-w" transform="translate(43,44) scale(.36)"/>
    <use href="#ta-w" transform="translate(52.2,44) scale(.36)"/>
    <use href="#ta-w" transform="translate(58.5,44) scale(.36)"/>
    <use href="#ta-w" transform="translate(69.5,44) scale(.36)"/>
  </g>
  <!-- 中排 -->
  <g>
    <use href="#ta-w" transform="translate(17.5,56) scale(.56)"/>
    <use href="#ta-w" transform="translate(25.2,56) scale(.56)"/>
    <use href="#ta-w" transform="translate(36.2,56) scale(.56)"/>
    <use href="#ta-w" transform="translate(43.8,56) scale(.56)"/>
    <use href="#ta-w" transform="translate(54.8,56) scale(.56)"/>
    <use href="#ta-w" transform="translate(62.5,56) scale(.56)"/>
  </g>
  <!-- 前排 -->
  <g>
    <use href="#ta-w" transform="translate(17.5,75.5) scale(1.05)"/>
    <use href="#ta-w" transform="translate(40,76.5) scale(1.1)"/>
    <use href="#ta-w" transform="translate(62.5,75.5) scale(1.05)"/>
  </g>
</svg>
