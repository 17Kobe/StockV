<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 敦煌莫高窟及月牙泉：左側黃褐崖壁上排列一個個小石窟，前方是倚崖而建的紅色九層樓；右側是金黃色鳴沙山沙丘，山腳一彎月牙形碧綠泉水，岸邊立著紅柱灰瓦的月泉閣 -->
  <defs>
    <linearGradient id="mgcCliff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2c08a"/>
      <stop offset=".6" stop-color="#c9a068"/>
      <stop offset="1" stop-color="#9c7444"/>
    </linearGradient>
    <linearGradient id="mgcDuneA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d98a"/>
      <stop offset="1" stop-color="#d9a24a"/>
    </linearGradient>
    <linearGradient id="mgcDuneB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c56a"/>
      <stop offset="1" stop-color="#c58a36"/>
    </linearGradient>
    <linearGradient id="mgcLake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe0c8"/>
      <stop offset="1" stop-color="#2f9a8e"/>
    </linearGradient>
    <linearGradient id="mgcRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e05a40"/>
      <stop offset="1" stop-color="#a8301e"/>
    </linearGradient>
    <linearGradient id="mgcRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e7478"/>
      <stop offset="1" stop-color="#3e4448"/>
    </linearGradient>
  </defs>

  <!-- 地面陰影 -->
  <ellipse cx="40" cy="74" rx="38" ry="3.5" fill="#000" opacity="0.15"/>

  <!-- 鳴沙山：後方大沙丘 -->
  <path d="M28,64 Q36,30 52,20 Q64,14 80,30 L80,66 Z" fill="url(#mgcDuneB)" stroke="#a8742e" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- 沙丘稜線（受光/背光分界） -->
  <path d="M52,20 Q56,34 50,46 Q46,56 50,64 L80,64 L80,30 Q64,14 52,20 Z" fill="#b8802e" opacity="0.35"/>
  <path d="M52,20 Q56,34 50,46 Q46,56 50,64" stroke="#fbe2a0" stroke-width="0.7" fill="none"/>
  <!-- 前方小沙丘 -->
  <path d="M30,72 Q44,48 60,52 Q72,54 80,48 L80,74 L30,74 Z" fill="url(#mgcDuneA)" stroke="#b07a34" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- 月牙泉 -->
  <path d="M41,60 Q46,74 64,72.4 Q77,71 78.6,58 Q72,66.4 62,66 Q50,65.6 41,60 Z" fill="url(#mgcLake)" stroke="#226e68" stroke-width="0.55" stroke-linejoin="round"/>
  <path d="M48,67.6 Q58,71 70,68.6" stroke="#d6fff2" stroke-width="0.6" fill="none" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </path>
  <!-- 泉邊蘆葦綠意 -->
  <g fill="#6aa046" stroke="#3e6a2a" stroke-width="0.3">
    <ellipse cx="44" cy="61.6" rx="2.4" ry="1.1"/>
    <ellipse cx="76" cy="60" rx="2" ry="1"/>
    <ellipse cx="70" cy="66.4" rx="2.4" ry="0.9"/>
  </g>

  <!-- 月泉閣（兩層，紅柱灰瓦飛簷） -->
  <g stroke="#3a2a22" stroke-width="0.4" stroke-linejoin="round">
    <rect x="55" y="58" width="12" height="7" fill="#e8d8b0"/>
    <path d="M56,58 V65 M59,58 V65 M63,58 V65 M66,58 V65" stroke="#b02a1a" stroke-width="0.9"/>
    <path d="M52,58.4 Q54,56.4 55,55.4 H67 Q68,56.4 70,58.4 Q61,57.2 52,58.4 Z" fill="url(#mgcRoof)"/>
    <rect x="57" y="51" width="8" height="4.6" fill="#e8d8b0"/>
    <path d="M58,51 V55.4 M61,51 V55.4 M64,51 V55.4" stroke="#b02a1a" stroke-width="0.8"/>
    <path d="M54.4,51.4 Q56,49.4 57.4,48.2 Q61,45.4 64.6,48.2 Q66,49.4 67.6,51.4 Q61,50.2 54.4,51.4 Z" fill="url(#mgcRoof)"/>
    <path d="M61,45.6 V44" stroke="#3a2a22" stroke-width="0.6"/>
  </g>

  <!-- 莫高窟崖壁 -->
  <path d="M0,18 Q6,14 14,16 Q22,13 30,17 Q34,18 36,24 L38,70 L0,72 Z" fill="url(#mgcCliff)" stroke="#7a5630" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M0,30 Q16,28 36.4,32 M0,46 Q18,44 37.2,48" stroke="#a87e4c" stroke-width="0.5" fill="none" opacity="0.7"/>
  <!-- 一排排石窟洞口 -->
  <g fill="#5a3a20">
    <path d="M2,24 h2 v2.4 h-2 Z M6,23.6 h2 v2.4 h-2 Z M28,24 h2 v2.4 h-2 Z M32,24.6 h2 v2.4 h-2 Z"/>
    <path d="M2,36 h2 v2.4 h-2 Z M6,35.6 h2 v2.4 h-2 Z M28,36 h2 v2.4 h-2 Z M32,36.4 h2 v2.4 h-2 Z"/>
    <path d="M2,52 h2 v2.4 h-2 Z M6,51.6 h2 v2.4 h-2 Z M30,52 h2 v2.4 h-2 Z M33.6,52.4 h2 v2.4 h-2 Z"/>
    <path d="M3,62 h2 v2.4 h-2 Z M31,62 h2 v2.4 h-2 Z"/>
  </g>
  <!-- 棧道 -->
  <path d="M0,40 H11 M25,40.4 H37 M0,57 H11 M25,57.4 H37.6" stroke="#8a5a30" stroke-width="0.7"/>

  <!-- 九層樓：倚崖而建的紅色多層樓閣 -->
  <g stroke="#3a2a22" stroke-width="0.4" stroke-linejoin="round">
    <!-- 牆身（由下往上逐層縮小） -->
    <rect x="11" y="60" width="14" height="10" fill="url(#mgcRed)"/>
    <rect x="11.6" y="52" width="12.8" height="6.4" fill="url(#mgcRed)"/>
    <rect x="12.2" y="44.6" width="11.6" height="6" fill="url(#mgcRed)"/>
    <rect x="12.8" y="37.6" width="10.4" height="5.6" fill="url(#mgcRed)"/>
    <rect x="13.4" y="31" width="9.2" height="5.2" fill="url(#mgcRed)"/>
    <rect x="14" y="25" width="8" height="4.8" fill="url(#mgcRed)"/>
    <rect x="14.8" y="19.6" width="6.4" height="4.2" fill="url(#mgcRed)"/>
    <!-- 窗格 -->
    <g fill="#f3d27a" stroke="none">
      <rect x="16.6" y="63" width="2.8" height="7"/>
      <rect x="13" y="62" width="2" height="3"/><rect x="21" y="62" width="2" height="3"/>
      <rect x="13.4" y="54" width="9.2" height="2.4"/>
      <rect x="14" y="46.4" width="8" height="2.2"/>
      <rect x="14.6" y="39.2" width="6.8" height="2"/>
      <rect x="15.2" y="32.6" width="5.6" height="1.8"/>
      <rect x="15.8" y="26.4" width="4.4" height="1.8"/>
      <rect x="16.4" y="20.8" width="3.2" height="1.6"/>
    </g>
    <!-- 各層飛簷屋頂 -->
    <g fill="url(#mgcRoof)">
      <path d="M7.6,60.4 Q9.6,59.6 11,58 H25 Q26.4,59.6 28.4,60.4 Q18,59.4 7.6,60.4 Z"/>
      <path d="M8.4,52.4 Q10.2,51.6 11.6,50.2 H24.4 Q25.8,51.6 27.6,52.4 Q18,51.4 8.4,52.4 Z"/>
      <path d="M9.2,45 Q10.8,44.2 12.2,42.8 H23.8 Q25.2,44.2 26.8,45 Q18,44 9.2,45 Z"/>
      <path d="M10,38 Q11.6,37.2 12.8,35.8 H23.2 Q24.4,37.2 26,38 Q18,37 10,38 Z"/>
      <path d="M10.8,31.4 Q12.4,30.6 13.4,29.4 H22.6 Q23.6,30.6 25.2,31.4 Q18,30.4 10.8,31.4 Z"/>
      <path d="M11.6,25.4 Q13,24.6 14,23.4 H22 Q23,24.6 24.4,25.4 Q18,24.4 11.6,25.4 Z"/>
      <!-- 頂層攢尖頂 -->
      <path d="M12,20 Q14,19.2 15.2,17.6 Q18,13.2 20.8,17.6 Q22,19.2 24,20 Q18,19 12,20 Z"/>
    </g>
    <path d="M18,13.6 V11.4" stroke="#c8a040" stroke-width="0.8"/>
    <circle cx="18" cy="11" r="0.7" fill="#e8c050"/>
  </g>
</svg>
