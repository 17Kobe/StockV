  <!-- 北京故宮・太和殿（2.5D）：紫禁城最大的宮殿，三層漢白玉須彌座台基（每層有白石欄杆），正面中間是大石階與雲龍石雕坡道；紅牆紅柱、青綠彩畫的額枋，頂上金黃琉璃瓦的重簷廡殿頂，正脊兩端有鴟吻，台基兩側立著銅鶴，殿內透出燈光（動畫）。光源左上，不描邊 -->
