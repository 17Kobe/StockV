<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 日月潭：層層翠綠山巒環抱碧綠湖面，右側山頭上有九層八角的慈恩塔（橘黃瓦簷），湖中圓形小島拉魯島長著一棵小樹，一艘小船拖出白色水痕，天上淡淡的太陽與彎月 -->
  <defs>
    <linearGradient id="smlLake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc6c0"/>
      <stop offset=".5" stop-color="#2a9ea6"/>
      <stop offset="1" stop-color="#1a7486"/>
    </linearGradient>
    <linearGradient id="smlHillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d4a8"/>
      <stop offset="1" stop-color="#7fb48a"/>
    </linearGradient>
    <linearGradient id="smlHillMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc060"/>
      <stop offset="1" stop-color="#3e8a46"/>
    </linearGradient>
    <linearGradient id="smlHillNear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fae4c"/>
      <stop offset="1" stop-color="#2a6a34"/>
    </linearGradient>
    <linearGradient id="smlRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc640"/>
      <stop offset="1" stop-color="#e07a1c"/>
    </linearGradient>
    <radialGradient id="smlSun" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="1" stop-color="#f6b83a"/>
    </radialGradient>
  </defs>
  <!-- 日與月 -->
  <circle cx="13" cy="13" r="4.2" fill="url(#smlSun)" stroke="#d48a1e" stroke-width=".4" opacity=".9"/>
  <path d="M27 8 A4.2 4.2 0 1 0 31 15 A3.4 3.4 0 1 1 27 8 Z" fill="#fff6c8" stroke="#c9b56a" stroke-width=".4" opacity=".9"/>
  <!-- 遠山 -->
  <path d="M2 50 Q8 34 18 38 Q26 28 36 36 Q46 30 52 38 Q62 32 72 40 Q78 44 78 50 Z" fill="url(#smlHillFar)" stroke="#6a9a74" stroke-width=".4"/>
  <!-- 中景山 -->
  <path d="M2 54 Q6 44 14 46 Q22 40 30 48 Q36 52 40 54 Z" fill="url(#smlHillMid)" stroke="#2f6a36" stroke-width=".45"/>
  <!-- 慈恩塔所在山頭 -->
  <path d="M38 54 Q46 46 52 40 Q58 34 64 38 Q72 42 78 54 Z" fill="url(#smlHillNear)" stroke="#1f5228" stroke-width=".5"/>
  <!-- 慈恩塔 -->
  <g stroke="#7a3a10" stroke-width=".3" transform="translate(59 39) scale(1.35 1) translate(-59 -39)">
    <rect x="57.4" y="35" width="3.2" height="4" fill="#f4ecd8"/>
    <rect x="57.8" y="30" width="2.4" height="5" fill="#f4ecd8"/>
    <rect x="58.1" y="25" width="1.8" height="5" fill="#f4ecd8"/>
    <rect x="58.4" y="20" width="1.2" height="5" fill="#f4ecd8"/>
    <g fill="url(#smlRoof)">
      <path d="M55.6 35.6 L62.4 35.6 L61 34.2 L57 34.2 Z"/>
      <path d="M56 33.3 L62 33.3 L60.8 32 L57.2 32 Z"/>
      <path d="M56.3 31 L61.7 31 L60.6 29.8 L57.4 29.8 Z"/>
      <path d="M56.6 28.8 L61.4 28.8 L60.4 27.6 L57.6 27.6 Z"/>
      <path d="M56.9 26.6 L61.1 26.6 L60.2 25.5 L57.8 25.5 Z"/>
      <path d="M57.2 24.5 L60.8 24.5 L60 23.5 L58 23.5 Z"/>
      <path d="M57.4 22.5 L60.6 22.5 L59.8 21.6 L58.2 21.6 Z"/>
      <path d="M57.6 20.7 L60.4 20.7 L59.7 19.8 L58.3 19.8 Z"/>
      <path d="M57.8 19 L60.2 19 L59 17.4 Z"/>
    </g>
    <path d="M59 17.4 L59 15.6" stroke="#c9861c" stroke-width=".5"/>
  </g>
  <!-- 湖面 -->
  <path d="M2 54 Q40 51 78 54 L78 70 Q40 76 2 70 Z" fill="url(#smlLake)" stroke="#0f5a68" stroke-width=".5"/>
  <!-- 山影倒影 -->
  <path d="M40 54 Q56 54 76 54 Q66 58 52 58 Q44 57 40 54 Z" fill="#1f6a5a" opacity=".35"/>
  <g stroke="#ffffff" stroke-width=".6" stroke-linecap="round" opacity=".5">
    <path d="M10 59 L18 59 M30 66 L38 66 M60 63 L68 63">
      <animate attributeName="opacity" values=".3;.7;.3" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 拉魯島 -->
  <ellipse cx="26" cy="60.5" rx="5" ry="1.8" fill="#6aa84a" stroke="#2a5a2a" stroke-width=".4"/>
  <rect x="25.6" y="56" width=".8" height="4" fill="#6b4a2a"/>
  <circle cx="26" cy="55.3" r="2.4" fill="url(#smlHillNear)" stroke="#1f5228" stroke-width=".4"/>
  <!-- 小船與水痕 -->
  <path d="M60 67 Q52 66 44 68 M60 67.6 Q52 69 46 71" stroke="#e8fbfa" stroke-width=".6" fill="none" stroke-linecap="round" opacity=".85"/>
  <path d="M59 66.5 L67 66.5 L65.5 68.4 L60 68.4 Z" fill="#f4f0e4" stroke="#5a4a3a" stroke-width=".4"/>
  <rect x="61.2" y="64.6" width="3.4" height="1.9" fill="#d8402e" stroke="#7a1a12" stroke-width=".35"/>
</svg>
