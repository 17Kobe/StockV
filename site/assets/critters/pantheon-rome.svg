<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="paStone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8e0c8"/>
    <stop offset="1" stop-color="#c0b48a"/>
  </linearGradient>
  <radialGradient id="paDome" cx="40%" cy="30%" r="70%">
    <stop offset="0" stop-color="#9a8a62"/>
    <stop offset="1" stop-color="#6b5c3c"/>
  </radialGradient>
</defs>
<!-- 萬神殿：門廊圓柱 + 後方巨大半球形圓頂（羅馬萬神殿最具代表性的識別特徵） -->
<path d="M18,62 Q40,16 62,62 Z" fill="url(#paDome)" stroke="#4a3f28" stroke-width="0.6"/>
<circle cx="40" cy="40" r="2.5" fill="#2a2418"/>
<!-- 門廊三角簷 -->
<polygon points="14,52 40,32 66,52" fill="url(#paStone)" stroke="#8a7a50" stroke-width="0.6"/>
<!-- 門廊柱列 -->
<g fill="url(#paStone)" stroke="#8a7a50" stroke-width="0.5">
  <rect x="17" y="52" width="4" height="18"/>
  <rect x="26" y="52" width="4" height="18"/>
  <rect x="35" y="52" width="4" height="18"/>
  <rect x="44" y="52" width="4" height="18"/>
  <rect x="53" y="52" width="4" height="18"/>
  <rect x="59" y="52" width="4" height="18"/>
</g>
<rect x="14" y="68" width="52" height="4" fill="#cbb988" stroke="#6b5c3c" stroke-width="0.5"/>
</svg>
