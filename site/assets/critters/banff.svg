<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 班夫國家公園：夢蓮湖（十峰谷），一排陡峭鋸齒狀的洛磯山雪峰，下方是乳白碧綠的冰川湖，兩岸深綠雲杉林，湖面上一艘紅色獨木舟 -->
  <defs>
    <linearGradient id="bnfRock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3adbb"/>
      <stop offset=".55" stop-color="#6f7a8a"/>
      <stop offset="1" stop-color="#4b5464"/>
    </linearGradient>
    <linearGradient id="bnfRockFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c4d2"/>
      <stop offset="1" stop-color="#8d99aa"/>
    </linearGradient>
    <linearGradient id="bnfLake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe4e6"/>
      <stop offset=".5" stop-color="#2cc6d2"/>
      <stop offset="1" stop-color="#1498b4"/>
    </linearGradient>
    <linearGradient id="bnfTree" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f7a46"/>
      <stop offset="1" stop-color="#173f28"/>
    </linearGradient>
  </defs>
  <!-- 遠山 -->
  <path d="M6 76 L18 40 L24 50 L34 26 L42 44 L50 30 L58 50 L66 74 Z" fill="url(#bnfRockFar)" stroke="#5f6a7a" stroke-width=".9"/>
  <!-- 十峰主峰群 -->
  <path d="M4 82 L14 58 L20 64 L30 34 L36 46 L46 18 L54 40 L60 30 L68 50 L78 22 L86 42 L92 34 L100 52 L110 28 L118 50 L124 60 L124 82 Z" fill="url(#bnfRock)" stroke="#3a4250" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- 雪紋 -->
  <g fill="#ffffff" stroke="#b9c6d4" stroke-width=".6">
    <path d="M46 18 L51 32 L48 29 L46 36 L43 28 L40 33 Z"/>
    <path d="M30 34 L34 44 L31 42 L29 48 L27 42 Z"/>
    <path d="M78 22 L83 35 L80 33 L78 40 L75 32 L72 36 Z"/>
    <path d="M110 28 L115 42 L112 40 L110 46 L107 39 L104 42 Z"/>
    <path d="M60 30 L64 40 L61 38 L59 43 L57 37 Z"/>
    <path d="M92 34 L96 43 L93 42 L91 46 L89 41 Z"/>
    <path d="M14 58 L17 64 L15 63 L13 66 L12 62 Z"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.1" fill="none" opacity=".8" stroke-linecap="round">
    <path d="M50 46 L52 56 M82 46 L84 58 M114 52 L116 60 M36 52 L37 60 M66 52 L67 60"/>
  </g>
  <!-- 碎石坡 -->
  <path d="M4 82 Q30 72 56 78 Q84 72 124 80 L124 86 L4 86 Z" fill="#8a8f8c" stroke="#5b605d" stroke-width=".8"/>
  <!-- 冰川湖 -->
  <path d="M4 84 Q64 80 124 84 L124 108 Q64 118 4 108 Z" fill="url(#bnfLake)" stroke="#0e6f88" stroke-width="1"/>
  <g stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity=".55">
    <path d="M30 92 L46 92 M70 96 L90 96 M44 102 L56 102">
      <animate attributeName="opacity" values=".3;.7;.3" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 紅色獨木舟 -->
  <g stroke="#5a1410" stroke-width=".9">
    <path d="M52 99 Q64 104 78 99 Q76 103 65 103.5 Q55 103 52 99 Z" fill="#d8352a"/>
    <path d="M64 101 L64 95" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="64" cy="94" r="1.6" fill="#f2c648"/>
    <path d="M60 104 L69 92" stroke="#7a4a22" stroke-width="1"/>
  </g>
  <!-- 左岸雲杉林 -->
  <g fill="url(#bnfTree)" stroke="#0f2c1a" stroke-width=".8">
    <path d="M2 112 L2 86 Q12 84 22 92 Q28 100 26 112 Z" fill="#2f5e38"/>
    <path d="M6 54 L11 72 L8.5 72 L13 88 L10 88 L15 104 L-3 104 L2 88 L-1 88 L3.5 72 L1 72 Z"/>
    <path d="M17 64 L21 78 L19 78 L23 92 L21 92 L25 106 L9 106 L13 92 L11 92 L15 78 L13 78 Z"/>
    <path d="M26 80 L29 90 L27.5 90 L31 102 L29.5 102 L32 112 L20 112 L22.5 102 L21 102 L24.5 90 L23 90 Z"/>
  </g>
  <!-- 右岸雲杉林 -->
  <g fill="url(#bnfTree)" stroke="#0f2c1a" stroke-width=".8">
    <path d="M126 112 L126 86 Q114 84 106 92 Q100 100 102 112 Z" fill="#2f5e38"/>
    <path d="M122 50 L127 68 L124.5 68 L129 86 L126 86 L131 104 L113 104 L118 86 L115 86 L119.5 68 L117 68 Z"/>
    <path d="M110 62 L114 76 L112 76 L116 90 L114 90 L118 106 L102 106 L106 90 L104 90 L108 76 L106 76 Z"/>
    <path d="M100 80 L103 90 L101.5 90 L105 102 L103.5 102 L106 112 L94 112 L96.5 102 L95 102 L98.5 90 L97 90 Z"/>
  </g>
</svg>
