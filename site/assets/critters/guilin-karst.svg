<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 桂林山水：高聳圓頂的喀斯特石灰岩峰（越遠越淡、雲霧繚繞），平靜灕江倒映山影；江上一條前端微翹的竹筏，戴斗笠的船夫撐著長竹篙，筏頭站著一隻鸕鶿 -->
  <defs>
    <linearGradient id="gk-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd8cc"/><stop offset="1" stop-color="#e2efe9"/>
    </linearGradient>
    <linearGradient id="gk-mid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cc79c"/><stop offset=".6" stop-color="#78a882"/><stop offset="1" stop-color="#5d8d6c"/>
    </linearGradient>
    <linearGradient id="gk-front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fae5a"/><stop offset=".55" stop-color="#3f8146"/><stop offset="1" stop-color="#275a36"/>
    </linearGradient>
    <linearGradient id="gk-mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gk-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6d6cf"/><stop offset="1" stop-color="#3f8590"/>
    </linearGradient>
    <linearGradient id="gk-bamboo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8cf7a"/><stop offset="1" stop-color="#a7843a"/>
    </linearGradient>
    <linearGradient id="gk-hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2a6"/><stop offset="1" stop-color="#c49a4c"/>
    </linearGradient>
    <clipPath id="gk-wclip"><path d="M1,57 Q40,53 79,57 L79,74 Q40,80 1,74 Z"/></clipPath>
    <g id="gk-fronts">
      <path d="M4,58 C3.5,30 8,10 15,10 C21.5,10 26.5,28 26,58 Z"/>
      <path d="M61,58 C60.5,40 64,30 70,30 C76,30 79.5,40 79,58 Z"/>
      <path d="M41,58 C41,47 44,40.5 48,40.5 C52,40.5 55,47 55,58 Z"/>
    </g>
  </defs>

  <!-- 遠峰 -->
  <g fill="url(#gk-back)" stroke="#9fbcb0" stroke-width="0.4">
    <path d="M22,54 C22,36 24.5,28 28,28 C31.5,28 34,36 34,54 Z"/>
    <path d="M46,54 C46,34 48.5,25 52,25 C55.5,25 58,34 58,54 Z"/>
    <path d="M32,54 C32,30 35,19 40,19 C45,19 48,30 48,54 Z"/>
  </g>
  <ellipse cx="40" cy="48" rx="26" ry="6" fill="#fff" opacity=".6"/>
  <!-- 中峰 -->
  <g fill="url(#gk-mid)" stroke="#4f7a5c" stroke-width="0.45">
    <path d="M55,56 C55,32 58,21 64,21 C70,21 73,32 73,56 Z"/>
    <path d="M27,56 C27,41 30.5,32 35.5,32 C40.5,32 44,41 44,56 Z"/>
  </g>
  <g fill="#c8e6b0" opacity=".55">
    <ellipse cx="61.5" cy="24" rx="2.4" ry="1.2"/><ellipse cx="33" cy="35" rx="2" ry="1"/>
  </g>
  <!-- 雲霧 -->
  <g>
    <path d="M6,52 Q8,48 14,49 Q22,45 32,48.5 Q42,45 52,48 Q62,45 70,48.5 Q77,48 76,52 Q72,55 40,55.5 Q10,55 6,52 Z" fill="#fff" opacity=".7"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;1.5,0;0,0" dur="10s" repeatCount="indefinite"/>
  </g>
  <!-- 近峰 -->
  <use href="#gk-fronts" fill="url(#gk-front)" stroke="#1f4a2c" stroke-width="0.6"/>
  <g fill="none" stroke-linecap="round">
    <path d="M10,16 Q12,12.5 16,12" stroke="#b6e08a" stroke-width="1" opacity=".8"/>
    <path d="M64,34 Q66,31.5 69,31.2 M44,44 Q46,42 48,41.8" stroke="#b6e08a" stroke-width="0.8" opacity=".8"/>
    <path d="M18,22 Q20,36 19,52 M9,30 Q8,42 9,54 M73,38 Q74,46 73,55" stroke="#8a9a88" stroke-width="0.5" opacity=".7"/>
  </g>
  <g fill="#2f6a3a">
    <circle cx="12" cy="24" r="1.4"/><circle cx="21" cy="30" r="1.2"/><circle cx="7.5" cy="40" r="1.3"/><circle cx="23" cy="44" r="1.2"/>
    <circle cx="66" cy="40" r="1.1"/><circle cx="75" cy="46" r="1.1"/><circle cx="50" cy="47" r="1"/>
  </g>

  <!-- 灕江 -->
  <path d="M1,57 Q40,53 79,57 L79,74 Q40,80 1,74 Z" fill="url(#gk-water)" stroke="#2c6670" stroke-width="0.6"/>
  <g clip-path="url(#gk-wclip)" opacity=".3">
    <use href="#gk-fronts" fill="#245a36" transform="translate(0,115) scale(1,-1)"/>
  </g>
  <g stroke="#e6f6f2" stroke-width="0.5" stroke-linecap="round" opacity=".7">
    <path d="M6,61 h8 M30,60 h6 M64,61.5 h9 M8,71 h6 M66,72 h7"/>
    <animate attributeName="opacity" values=".7;.35;.7" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- 竹篙 -->
  <path d="M56,41 L41,77" stroke="#7a5a2a" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 竹筏 -->
  <ellipse cx="38" cy="68.6" rx="26" ry="1.6" fill="#1f5a64" opacity=".35"/>
  <g stroke="#6e5220" stroke-width="0.45" stroke-linejoin="round">
    <path d="M11,61.5 Q14.5,64.2 20,64.6 L63,64.6 L63.6,67.8 L20,68.2 Q13.4,67.6 10.4,62.6 Z" fill="url(#gk-bamboo)"/>
    <path d="M11.6,63.6 Q15,65.6 20,65.7 L63.2,65.7 M12.4,64.9 Q15.4,66.6 20,66.9 L63.4,66.9" fill="none"/>
    <path d="M27,64.6 v3.5 M43,64.6 v3.5 M58,64.6 v3.2" stroke="#4a3412" stroke-width="0.7"/>
    <path d="M34,64.8 v3 M50,64.8 v3" stroke="#b49444" stroke-width="0.35"/>
  </g>

  <!-- 鸕鶿 -->
  <g stroke="#111" stroke-width="0.3" stroke-linejoin="round">
    <path d="M19,64.6 Q18,61 20,58.6 Q21.5,57 23.6,58.4 Q25.2,60.6 24,63.2 Q22,64.8 19,64.6 Z" fill="#1d2228"/>
    <path d="M21.4,59 Q20.6,56 21.2,54.2 L22.4,54.4 Q22,56.4 22.6,58.6 Z" fill="#1d2228"/>
    <circle cx="21.8" cy="54" r="1.1" fill="#1d2228"/>
    <path d="M22.6,53.6 L24.6,54 Q24.6,54.7 24,54.6 L22.7,54.6 Z" fill="#f2b632"/>
  </g>
  <circle cx="21.9" cy="53.7" r="0.3" fill="#9fd4ff"/>

  <!-- 船夫 -->
  <g stroke="#2a2418" stroke-width="0.4" stroke-linejoin="round">
    <rect x="46.4" y="58" width="1.5" height="4.2" fill="#2a3448"/>
    <rect x="48.4" y="58" width="1.5" height="4.2" fill="#2a3448"/>
    <rect x="46.5" y="62" width="1.3" height="2.6" fill="#d9a77a"/>
    <rect x="48.5" y="62" width="1.3" height="2.6" fill="#d9a77a"/>
    <path d="M45.4,51.2 Q48,50 50.8,51.2 L51,58.6 L45.2,58.6 Z" fill="#3b6aa8"/>
    <path d="M50.4,51.6 L51.6,53.4" stroke="#3b6aa8" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M45.8,52.2 Q46.4,55.4 49.8,56" fill="none" stroke="#3b6aa8" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="51.2" cy="53" r="0.75" fill="#d9a77a"/>
    <circle cx="49.9" cy="56" r="0.75" fill="#d9a77a"/>
    <circle cx="48.1" cy="48.9" r="1.6" fill="#d9a77a"/>
    <path d="M42.2,48.6 L48.1,43.8 L54,48.6 Q48.1,50 42.2,48.6 Z" fill="url(#gk-hat)"/>
    <path d="M45,46.4 L51.2,46.4" stroke="#a87e38" stroke-width="0.3"/>
  </g>
</svg>
