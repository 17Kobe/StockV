<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 淺草寺雷門：朱紅門樓與黑瓦屋頂，正中懸掛巨大紅色提燈，燈上寫黑色「雷門」 -->
  <defs>
    <linearGradient id="kmPillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4a36"/>
      <stop offset="1" stop-color="#9c1a12"/>
    </linearGradient>
    <linearGradient id="kmRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5f68"/>
      <stop offset="1" stop-color="#22252b"/>
    </linearGradient>
    <linearGradient id="kmBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2412e"/>
      <stop offset="1" stop-color="#9c1a12"/>
    </linearGradient>
    <radialGradient id="kmLantern" cx="0.36" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ff6a4e"/>
      <stop offset="0.55" stop-color="#d8261c"/>
      <stop offset="1" stop-color="#8e100c"/>
    </radialGradient>
    <linearGradient id="kmBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.35" stop-color="#151515"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="kmMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8d79a"/>
      <stop offset="0.4" stop-color="#b8973e"/>
      <stop offset="1" stop-color="#6e5420"/>
    </linearGradient>
  </defs>

  <!-- 地面陰影 -->
  <ellipse cx="40" cy="75" rx="34" ry="3.2" fill="#000" opacity="0.2"/>

  <!-- 門柱 -->
  <rect x="5" y="20" width="7" height="55" fill="url(#kmPillar)" stroke="#5a0e0a" stroke-width="0.6"/>
  <rect x="68" y="20" width="7" height="55" fill="url(#kmPillar)" stroke="#5a0e0a" stroke-width="0.6"/>
  <!-- 兩側龕中風神雷神（簡化） -->
  <rect x="12" y="44" width="7" height="31" fill="#4a1410" stroke="#5a0e0a" stroke-width="0.5"/>
  <rect x="61" y="44" width="7" height="31" fill="#4a1410" stroke="#5a0e0a" stroke-width="0.5"/>
  <g stroke="#1a1a1a" stroke-width="0.4">
    <circle cx="15.5" cy="51" r="2.2" fill="#3f8a4a"/>
    <path d="M12.8 74 L13.6 55 Q15.5 53 17.4 55 L18.2 74Z" fill="#3f8a4a"/>
    <circle cx="64.5" cy="51" r="2.2" fill="#c03a2a"/>
    <path d="M61.8 74 L62.6 55 Q64.5 53 66.4 55 L67.2 74Z" fill="#c03a2a"/>
  </g>

  <!-- 橫樑 -->
  <rect x="3" y="19" width="74" height="4" fill="url(#kmBeam)" stroke="#5a0e0a" stroke-width="0.6"/>
  <rect x="3" y="26" width="74" height="2.6" fill="url(#kmBeam)" stroke="#5a0e0a" stroke-width="0.5"/>
  <rect x="11" y="22.8" width="58" height="3.4" fill="#7c140e"/>

  <!-- 黑瓦屋頂 -->
  <path d="M1 18.6 Q14 15.6 18 9 L62 9 Q66 15.6 79 18.6 Q40 21 1 18.6Z" fill="url(#kmRoof)" stroke="#111" stroke-width="0.6" stroke-linejoin="round"/>
  <g stroke="#7a808a" stroke-width="0.4" opacity="0.7">
    <line x1="24" y1="10" x2="22" y2="18.6"/>
    <line x1="32" y1="10" x2="31" y2="19.2"/>
    <line x1="40" y1="10" x2="40" y2="19.4"/>
    <line x1="48" y1="10" x2="49" y2="19.2"/>
    <line x1="56" y1="10" x2="58" y2="18.6"/>
  </g>
  <rect x="16" y="6.4" width="48" height="3" rx="1" fill="#2a2d33" stroke="#111" stroke-width="0.5"/>
  <path d="M14 6 Q16 7.6 17 8.6 M66 6 Q64 7.6 63 8.6" stroke="#111" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- 大提燈（輕微搖晃） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 40 28;1.6 40 28;0 40 28;-1.6 40 28;0 40 28" dur="5s" repeatCount="indefinite"/>
    <!-- 上方黑色環帶 -->
    <path d="M28 28.4 L52 28.4 L53 33.6 L27 33.6Z" fill="url(#kmBand)" stroke="#000" stroke-width="0.5"/>
    <!-- 紅色燈身 -->
    <path d="M27 33 Q19 50 27 67 L53 67 Q61 50 53 33Z" fill="url(#kmLantern)" stroke="#5e0a08" stroke-width="0.7"/>
    <!-- 橫向竹骨 -->
    <g fill="none" stroke="#8a100c" stroke-width="0.45" opacity="0.75">
      <path d="M25.6 37 Q40 38.4 54.4 37"/>
      <path d="M24.2 41 Q40 42.6 55.8 41"/>
      <path d="M23.4 45 Q40 46.8 56.6 45"/>
      <path d="M23 49 Q40 50.8 57 49"/>
      <path d="M23 53 Q40 54.8 57 53"/>
      <path d="M23.4 57 Q40 58.6 56.6 57"/>
      <path d="M24.2 61 Q40 62.4 55.8 61"/>
      <path d="M25.6 64.6 Q40 65.8 54.4 64.6"/>
    </g>
    <!-- 雷門 -->
    <text x="40" y="49" text-anchor="middle" font-family="'Yu Mincho','MS Mincho','Noto Serif JP','Noto Serif CJK JP',serif" font-weight="900" font-size="15.5" fill="#0c0c0c">雷</text>
    <text x="40" y="64" text-anchor="middle" font-family="'Yu Mincho','MS Mincho','Noto Serif JP','Noto Serif CJK JP',serif" font-weight="900" font-size="15.5" fill="#0c0c0c">門</text>
    <!-- 高光 -->
    <path d="M27.6 38 Q24.6 46 25.6 56" fill="none" stroke="#ffb09a" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
    <!-- 下方黑色環帶與金屬底環 -->
    <path d="M27 66.4 L53 66.4 L52 71 L28 71Z" fill="url(#kmBand)" stroke="#000" stroke-width="0.5"/>
    <ellipse cx="40" cy="71.4" rx="12.4" ry="1.6" fill="url(#kmMetal)" stroke="#4a3812" stroke-width="0.4"/>
    <ellipse cx="40" cy="73" rx="5" ry="1" fill="url(#kmMetal)" stroke="#4a3812" stroke-width="0.4"/>
  </g>
</svg>
