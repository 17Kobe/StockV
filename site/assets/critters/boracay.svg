<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="boSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bdeaff"/>
    <stop offset="1" stop-color="#eaf8ff"/>
  </linearGradient>
  <linearGradient id="boSea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4fd6d2"/>
    <stop offset="0.6" stop-color="#1fa8c9"/>
    <stop offset="1" stop-color="#0f7aa8"/>
  </linearGradient>
  <linearGradient id="boSand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff6e0"/>
    <stop offset="1" stop-color="#f2dba0"/>
  </linearGradient>
</defs>
<!-- 天空部份鏤空（不鋪底色），讓圖示背景透明融入地圖 -->
<!-- 長灘島著名的白沙與藍綠色清澈海水 -->
<path d="M0,20 Q40,14 80,20 L80,62 L0,62 Z" fill="url(#boSea)"/>
<g opacity="0.5" stroke="#eafdff" stroke-width="1" fill="none" stroke-linecap="round">
  <path d="M8,34 Q14,31 20,34"/>
  <path d="M46,40 Q53,37 60,40"/>
  <path d="M20,48 Q28,45 36,48"/>
</g>
<path d="M0,58 Q40,50 80,58 L80,80 L0,80 Z" fill="url(#boSand)" stroke="#d8bc7a" stroke-width="0.5"/>
<!-- 兩艘多彩的菲律賓傳統雙邊架帆船（paraw），是長灘島最具代表性的畫面 -->
<g>
  <line x1="18" y1="36" x2="26" y2="36" stroke="#6b4a28" stroke-width="1"/>
  <line x1="20" y1="44" x2="20" y2="36" stroke="#6b4a28" stroke-width="1"/>
  <path d="M14,46 Q22,42 30,46 L28,48 L16,48 Z" fill="#caa06a" stroke="#6b4a28" stroke-width="0.5"/>
  <path d="M20,36 L20,24 L28,34 Z" fill="#e8562f" stroke="#8c2a12" stroke-width="0.5"/>
</g>
<g>
  <path d="M44,54 Q54,49 64,54 L62,57 L46,57 Z" fill="#b8905c" stroke="#5c3e1c" stroke-width="0.5"/>
  <path d="M54,43 L54,28 L64,41 Z" fill="#2a9d8f" stroke="#176a60" stroke-width="0.5"/>
</g>
<!-- 椰子樹 -->
<path d="M10,78 Q13,60 9,46" fill="none" stroke="#7a5230" stroke-width="2.2" stroke-linecap="round"/>
<g fill="#2f8f4e" stroke="#1d5c32" stroke-width="0.4">
  <path d="M9,46 Q1,41 3,46 Q6,50 9,46 Z"/>
  <path d="M9,46 Q17,39 19,44 Q13,50 9,46 Z"/>
  <path d="M9,46 Q5,35 10,33 Q14,40 9,46 Z"/>
</g>
<!-- 沙灘傘 -->
<path d="M68,62 Q60,50 72,50 Q84,50 76,62 Z" fill="#e85d4f" stroke="#8c2a12" stroke-width="0.5"/>
<line x1="72" y1="50" x2="72" y2="68" stroke="#6b4a28" stroke-width="1.4"/>
</svg>
