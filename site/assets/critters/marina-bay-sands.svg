<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="mbsSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd9a0"/>
    <stop offset="1" stop-color="#8fc7e8"/>
  </linearGradient>
  <linearGradient id="mbsTower" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#cfe3ee"/>
    <stop offset="0.5" stop-color="#8fa8bb"/>
    <stop offset="1" stop-color="#5c7486"/>
  </linearGradient>
  <linearGradient id="mbsDeck" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8eef2"/>
    <stop offset="1" stop-color="#a8b8c2"/>
  </linearGradient>
  <linearGradient id="mbsWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a7fa0"/>
    <stop offset="1" stop-color="#1c4a66"/>
  </linearGradient>
</defs>
<!-- 天空部份鏤空（不鋪底色），讓圖示背景透明融入地圖 -->
<!-- 遠處城市天際線剪影 -->
<g fill="#3a5a72" opacity="0.5">
  <rect x="2" y="38" width="5" height="14"/>
  <rect x="9" y="32" width="4" height="20"/>
  <rect x="66" y="34" width="5" height="18"/>
  <rect x="72" y="40" width="4" height="12"/>
</g>
<!-- 海灣水面 -->
<rect x="0" y="50" width="80" height="30" fill="url(#mbsWater)"/>
<g opacity="0.3" stroke="#bfe0ee" stroke-width="0.8" fill="none">
  <path d="M10,64 Q20,62 30,64"/>
  <path d="M46,70 Q56,68 66,70"/>
</g>
<!-- 三座塔樓倒影 -->
<g opacity="0.25">
  <polygon points="17,52 25,52 24,70 18,70" fill="#8fa8bb"/>
  <polygon points="35,52 45,52 44,70 36,70" fill="#8fa8bb"/>
  <polygon points="55,52 63,52 62,70 56,70" fill="#8fa8bb"/>
</g>
<!-- 三座向上微微收窄的塔樓 -->
<polygon points="16,52 25,52 23,16 18,16" fill="url(#mbsTower)" stroke="#3f5868" stroke-width="0.5"/>
<polygon points="35,52 45,52 43,10 37,10" fill="url(#mbsTower)" stroke="#3f5868" stroke-width="0.5"/>
<polygon points="55,52 64,52 62,16 57,16" fill="url(#mbsTower)" stroke="#3f5868" stroke-width="0.5"/>
<g stroke="#3f5868" stroke-width="0.3" opacity="0.5">
  <line x1="18" y1="20" x2="23" y2="20"/>
  <line x1="18" y1="28" x2="23" y2="28"/>
  <line x1="18" y1="36" x2="23" y2="36"/>
  <line x1="18" y1="44" x2="23" y2="44"/>
  <line x1="37.5" y1="16" x2="42.5" y2="16"/>
  <line x1="37.5" y1="26" x2="42.5" y2="26"/>
  <line x1="37.5" y1="36" x2="42.5" y2="36"/>
  <line x1="37.5" y1="46" x2="42.5" y2="46"/>
  <line x1="57.5" y1="20" x2="62.5" y2="20"/>
  <line x1="57.5" y1="28" x2="62.5" y2="28"/>
  <line x1="57.5" y1="36" x2="62.5" y2="36"/>
  <line x1="57.5" y1="44" x2="62.5" y2="44"/>
</g>
<!-- 空中花園「衝浪板」頂樓泳池甲板，是濱海灣金沙最具代表性的識別特徵 -->
<path d="M8,16 Q40,4 72,16 L70,22 Q40,12 10,22 Z" fill="url(#mbsDeck)" stroke="#5c7282" stroke-width="0.6"/>
<!-- 甲板上著名的無邊際空中泳池 -->
<path d="M14,17.5 Q40,8 66,17.5" stroke="#5bc8e8" stroke-width="2" fill="none" opacity="0.85"/>
<!-- 甲板邊緣幾棵小樹 -->
<g fill="#2f8f4e">
  <circle cx="20" cy="16.5" r="1.6"/>
  <circle cx="30" cy="12.5" r="1.6"/>
  <circle cx="50" cy="12.5" r="1.6"/>
  <circle cx="60" cy="16.5" r="1.6"/>
</g>
</svg>
