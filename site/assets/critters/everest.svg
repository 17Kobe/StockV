<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="evRock" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7a8794"/>
    <stop offset=".5" stop-color="#4c5866"/>
    <stop offset="1" stop-color="#2a323e"/>
  </linearGradient>
  <linearGradient id="evBack" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9aa8ba"/>
    <stop offset="1" stop-color="#5c6a80"/>
  </linearGradient>
  <linearGradient id="evSnow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#c6d4e6"/>
  </linearGradient>
</defs>
<!-- 聖母峰：不是單一個三角形，而是一整片崎嶇的群峰。主峰是頂端略歪的黑色岩石金字塔，
     稜線鋸齒不平、斜坡上積雪一條一條，前面有較低的努子峰擋住山腳，山頂被強風吹出長長的雪煙 -->
<!-- 後排遠山（淡藍灰） -->
<path d="M0 60 L8 44 L13 48 L20 36 L26 44 L30 40 L36 52 L46 46 L54 50 L60 34 L66 42 L72 38 L80 50 V72 H0Z" fill="url(#evBack)" opacity=".75"/>
<path d="M20 36 L18 40 L22 40Z M60 34 L57.6 39 L62.4 39Z M72 38 L70.4 41.6 L73.6 41.6Z" fill="#ffffff" opacity=".9"/>
<!-- 主峰：頂端略偏左、左稜線長、右側陡；稜線帶小鋸齒 -->
<path d="M8 72 Q14 62 18 56 L22 50 L24 51 L27 43 L29 44 L32 34 L34 35 L37 22 L39 21 L41 8 L44 14 L45 13 L48 22 L50 21 L53 32 L55 31 L58 42 L60 41 L64 52 Q68 62 72 72Z"
      fill="url(#evRock)" stroke="#1a2028" stroke-width=".6" stroke-linejoin="round"/>
<!-- 受光的西稜（左側亮面） -->
<path d="M41 8 L39 21 L37 22 L34 35 L32 34 L29 44 L27 43 L24 51 L22 50 L18 56 Q14 62 8 72 L20 72 Q24 60 30 48 Q36 32 41 8Z" fill="#c4ced8" opacity=".35"/>
<!-- 頂峰覆雪＋往下拉的雪溝（不畫成整齊的雪帽） -->
<path d="M41 8 L44 14 L45 13 L47 19 L45 18 L44.4 24 L43 19 L41.6 26 L40.6 19 L39 23 L38.4 19.6 Z" fill="url(#evSnow)" stroke="#aabbd0" stroke-width=".3"/>
<path d="M33 35 L31 42 M35.6 30 L33.4 40 M50.6 26 L52 36 M54.4 33 L56.4 42 M28 45 L26 52 M59 44 L61 52" stroke="#eef4fb" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
<!-- 黃帶（聖母峰頂下方有名的淺色岩層） -->
<path d="M37.6 24 Q42 25.6 47.4 23.4" stroke="#c9b48a" stroke-width="1.4" fill="none" opacity=".7"/>
<!-- 強風吹起的雪煙：聖母峰照片最常見的識別特徵 -->
<path d="M44 10 Q54 7 64 10 Q70 12 77 9" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity=".75">
  <animate attributeName="opacity" values=".4;.85;.4" dur="2.4s" repeatCount="indefinite"/>
</path>
<path d="M44.6 13.4 Q52 12.6 59 15" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity=".6">
  <animate attributeName="opacity" values=".6;.25;.6" dur="2.4s" repeatCount="indefinite"/>
</path>
<!-- 前排較低的努子峰，擋住主峰山腳 -->
<path d="M0 72 L6 62 L10 64 L16 54 L20 58 L24 52 L30 60 L34 58 L40 66 L48 60 L52 62 L58 54 L62 58 L68 52 L74 60 L80 58 V76 H0Z" fill="#3a4654" stroke="#1a2028" stroke-width=".5" stroke-linejoin="round"/>
<path d="M16 54 L14 58 L18 58Z M24 52 L22.4 55.6 L26 55.6Z M58 54 L56 58 L60 58Z M68 52 L66.4 55.6 L70 55.6Z" fill="#ffffff" opacity=".9"/>
<!-- 冰河 -->
<path d="M30 76 Q36 66 40 66 Q44 66 50 76Z" fill="#dbe8f4" opacity=".9"/>
<!-- 登山者 -->
<g>
  <circle cx="20" cy="61" r="1.6" fill="#e63946"/>
  <path d="M20 62.6 L20 65.4 M20 65.4 L18.4 68.6 M20 65.4 L21.6 68.6" stroke="#2b2b2b" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <line x1="23" y1="57.6" x2="23" y2="66" stroke="#4a3b2c" stroke-width=".9" stroke-linecap="round"/>
  <polygon points="23,57.6 27.6,59.4 23,61.2" fill="#f4a300" stroke="#a66e00" stroke-width=".3"/>
</g>
<!-- 經幡 -->
<g>
  <path d="M42 26 Q48 27 54 32" fill="none" stroke="#4a3b2c" stroke-width=".7"/>
  <polygon points="42,26 45,26.5 43.6,29.6" fill="#1d6fd1"/>
  <polygon points="45,26.5 47.6,27.6 46.4,30.6" fill="#ffffff"/>
  <polygon points="47.6,27.6 50,29 48.8,32" fill="#e63946"/>
  <polygon points="50,29 52.2,30.6 51,33.4" fill="#2a9d8f"/>
  <polygon points="52.2,30.6 54,32 53,34.6" fill="#f4a300"/>
</g>
</svg>
