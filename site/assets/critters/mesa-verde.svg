<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="mvCliff" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c49068"/>
    <stop offset="1" stop-color="#8a6040"/>
  </linearGradient>
  <linearGradient id="mvDwell" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8b088"/>
    <stop offset="1" stop-color="#a87850"/>
  </linearGradient>
</defs>
<!-- 梅薩維德國家公園崖居：美洲原住民 Ancestral Pueblo 建於懸崖凹壁中的石造聚落 -->
<path d="M0,10 Q30,4 40,22 Q50,4 80,14 L80,56 Q40,46 0,56 Z" fill="url(#mvCliff)" stroke="#5c3f28" stroke-width="0.5"/>
<path d="M4,46 Q40,38 76,46 L76,80 L4,80 Z" fill="url(#mvCliff)" opacity="0.6"/>
<!-- 嵌在凹壁裡的多層石造房屋群 -->
<g fill="url(#mvDwell)" stroke="#5c3f28" stroke-width="0.4">
  <rect x="14" y="34" width="10" height="12"/>
  <rect x="24" y="30" width="9" height="16"/>
  <rect x="33" y="36" width="8" height="10"/>
  <rect x="41" y="28" width="9" height="18"/>
  <rect x="50" y="34" width="10" height="12"/>
  <rect x="60" y="30" width="8" height="16"/>
</g>
<g fill="#5c3f28" opacity="0.7">
  <rect x="17" y="38" width="2" height="3"/>
  <rect x="27" y="35" width="2" height="3"/>
  <rect x="44" y="33" width="2" height="3"/>
  <rect x="53" y="38" width="2" height="3"/>
</g>
<!-- 木梯 -->
<line x1="36" y1="46" x2="36" y2="56" stroke="#4a3220" stroke-width="1.4"/>
</svg>
