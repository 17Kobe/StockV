<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<defs>
  <linearGradient id="mlWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5bb6e0"/>
    <stop offset="1" stop-color="#0c3f61"/>
  </linearGradient>
  <linearGradient id="mlRock" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9c998c"/>
    <stop offset="1" stop-color="#5c594e"/>
  </linearGradient>
  <radialGradient id="mlBody" cx="40%" cy="30%" r="80%">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#c7d2da"/>
  </radialGradient>
  <linearGradient id="mlScale" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e3ecf1"/>
    <stop offset="1" stop-color="#aebccb"/>
  </linearGradient>
  <radialGradient id="mlMane" cx="45%" cy="30%" r="80%">
    <stop offset="0" stop-color="#fef9ef"/>
    <stop offset="1" stop-color="#d8c79a"/>
  </radialGradient>
</defs>

<!-- 海灣水面 -->
<path d="M0,96 Q20,91 38,96 Q56,101 74,96 Q92,91 110,96 Q119,98.5 128,96 L128,128 L0,128 Z" fill="url(#mlWater)"/>
<path d="M6,100 Q22,96 38,100 Q54,104 70,100" stroke="#bfe6f5" stroke-width="1" fill="none" opacity=".5"/>
<path d="M70,104 Q86,100 102,104 Q112,106.5 120,104" stroke="#bfe6f5" stroke-width="1" fill="none" opacity=".45"/>

<!-- 腳下岩礁 -->
<path d="M58,88 Q50,86 48,94 Q46,101 54,105 Q64,109 78,106 Q92,103 92,92 Q92,83 80,82 Q68,81 58,88 Z" fill="url(#mlRock)" stroke="#44433a" stroke-width="1"/>

<!-- 魚尾（捲向右後方，帶鱗片與尾鰭） -->
<g>
  <path d="M70,96 C86,92 100,78 98,58 C97,47 90,40 83,42 C88,50 90,60 84,70 C79,79 71,86 62,90 Z" fill="url(#mlScale)" stroke="#8ea0b0" stroke-width="1"/>
  <!-- 尾鰭 -->
  <path d="M83,42 C90,34 102,30 112,34 C106,38 101,43 98,49 C104,47 111,48 116,53 C107,55 97,56 90,52 Z" fill="url(#mlScale)" stroke="#8ea0b0" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 90 45;8 90 45;0 90 45;-6 90 45;0 90 45" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <!-- 鱗片紋路 -->
  <g stroke="#8ea0b0" stroke-width=".8" fill="none" opacity=".75">
    <path d="M68,92 q3,-3 6,0"/>
    <path d="M74,85 q3,-3 6,0"/>
    <path d="M80,77 q3,-3 6,0"/>
    <path d="M85,68 q3,-3 6,0"/>
    <path d="M89,58 q3,-3 5,0"/>
  </g>
</g>

<!-- 直立的獅身前半（胸膛與前腿站在岩礁上） -->
<path d="M44,106 C40,92 40,76 46,64 C50,56 55,50 54,40 C53,33 58,30 62,34 C62,42 59,49 56,56 C52,64 51,74 54,84 C56,91 58,98 60,106 Z" fill="url(#mlBody)" stroke="#8495a4" stroke-width="1"/>
<ellipse cx="50" cy="104" rx="9" ry="5" fill="#dfe6ec" stroke="#8495a4" stroke-width=".8"/>
<ellipse cx="60" cy="105" rx="9" ry="5" fill="#dfe6ec" stroke="#8495a4" stroke-width=".8"/>

<!-- 鬃毛（環繞獅頭一圈的毛束） -->
<g>
  <ellipse cx="48" cy="28" rx="23" ry="22" fill="url(#mlMane)" stroke="#b8a473" stroke-width="1"/>
  <g fill="url(#mlMane)" stroke="#b8a473" stroke-width=".8">
    <path d="M27,20 Q20,16 22,8 Q29,10 30,18 Z"/>
    <path d="M29,34 Q19,33 18,25 Q26,24 30,30 Z"/>
    <path d="M34,44 Q25,46 21,39 Q28,35 34,38 Z"/>
    <path d="M62,38 Q68,43 64,50 Q58,47 58,40 Z"/>
    <path d="M67,26 Q76,25 77,17 Q69,16 65,22 Z"/>
    <path d="M62,14 Q68,8 76,12 Q72,19 64,20 Z"/>
    <path d="M44,8 Q46,0 54,1 Q53,9 46,12 Z"/>
  </g>
</g>

<!-- 獅臉 -->
<ellipse cx="48" cy="30" rx="15.5" ry="14.5" fill="url(#mlBody)" stroke="#8495a4" stroke-width="1"/>
<ellipse cx="42" cy="27" rx="2.6" ry="3.2" fill="#232a33"/>
<ellipse cx="55" cy="27" rx="2.6" ry="3.2" fill="#232a33"/>
<circle cx="43" cy="25.6" r="1" fill="#f4f7f9"/>
<circle cx="56" cy="25.6" r="1" fill="#f4f7f9"/>
<!-- 鼻子與嘴（吐水口） -->
<path d="M44,34 L52,34 L48,39 Z" fill="#c75c4a" stroke="#8c3f32" stroke-width=".6"/>
<path d="M48,39 Q44,43 39,41.5" stroke="#3a4753" stroke-width="1.1" fill="none" stroke-linecap="round"/>
<ellipse cx="48" cy="42.5" rx="3.6" ry="2.4" fill="#2a3440"/>

<!-- 口中吐出的水柱，弧線落入海灣 -->
<path d="M48,43 C40,48 30,54 24,64 C19,72 18,80 21,88" fill="none" stroke="#6fc2e9" stroke-width="3" stroke-linecap="round" opacity=".88" stroke-dasharray="5 4">
  <animate attributeName="stroke-dashoffset" values="0;-18" dur="0.7s" repeatCount="indefinite"/>
</path>
<circle cx="21" cy="90" r="2.2" fill="#cdeeff" opacity=".85">
  <animate attributeName="r" values="1.6;3.2;1.6" dur="1s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".85;.3;.85" dur="1s" repeatCount="indefinite"/>
</circle>
<circle cx="17" cy="94" r="1.4" fill="#cdeeff" opacity=".6">
  <animate attributeName="r" values="1;2;1" dur="1.1s" repeatCount="indefinite" begin=".2s"/>
  <animate attributeName="opacity" values=".6;.2;.6" dur="1.1s" repeatCount="indefinite" begin=".2s"/>
</circle>
</svg>
