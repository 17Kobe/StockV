  <!-- 吉薩金字塔群（2.5D）：埃及吉薩高原上的三座金字塔（胡夫、卡夫拉、孟卡拉），石塊一層層堆成階梯紋，卡夫拉金字塔頂端還留著白色外殼、在陽光下閃光；前方是戴法老頭巾的人面獅身像，一隻駱駝與藍衣騎士慢慢走過沙漠（動畫）。光源左上，不描邊 -->
