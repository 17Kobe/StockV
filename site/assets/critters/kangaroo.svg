  <!-- 紅大袋鼠（2.5D，朝左）：澳洲內陸的紅大袋鼠，橘紅色的身體配米白色的肚子，粗壯的後腿與大尾巴撐著身體站立，短短的前肢放在胸前，育兒袋裡的小袋鼠探出頭左右張望，一對長耳朵輪流轉動、頭點著（動畫；跳躍由地圖的 hop 步態負責）。光源左上，不描邊 -->
