  <!-- 黃石國家公園（2.5D）：世界第一座國家公園，大稜鏡溫泉中央湛藍、外圈一圈圈綠黃橘紅的細菌環，蒸氣裊裊上升；老忠實間歇泉每隔一陣子噴出高高的水柱與水霧，周圍長著松樹，一頭美洲野牛在旁吃草（動畫）。光源左上，不描邊 -->
