<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 拉什莫爾山（總統山）：灰粉色花崗岩山壁上刻著四位總統頭像，由左至右為華盛頓、傑佛遜（後方微側）、老羅斯福（凹入、戴圓眼鏡留八字鬍）、林肯（落腮鬍）；下方是碎石坡與松樹 -->
  <defs>
    <linearGradient id="rmCliff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c8c0"/>
      <stop offset=".55" stop-color="#ab9890"/>
      <stop offset="1" stop-color="#76655f"/>
    </linearGradient>
    <radialGradient id="rmFace" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#f1e4dc"/>
      <stop offset=".55" stop-color="#cdbab1"/>
      <stop offset="1" stop-color="#9a8780"/>
    </radialGradient>
    <linearGradient id="rmTalus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2b0a8"/>
      <stop offset="1" stop-color="#8a7871"/>
    </linearGradient>
    <linearGradient id="rmPine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8a4a"/>
      <stop offset="1" stop-color="#244f2a"/>
    </linearGradient>
    <!-- 基本臉部：額頭、眉骨、眼窩、鼻樑與嘴 -->
    <g id="rmHead">
      <path d="M-9,-5 Q-10,-16 0,-16 Q10,-16 9.5,-5 L8.5,6 Q6.5,14.5 0,15.5 Q-6.5,14.5 -8.5,6 Z" fill="url(#rmFace)" stroke="#6e5c57" stroke-width=".9"/>
      <path d="M3,-15.5 Q10,-14 9.5,-5 L8.5,6 Q6.5,14.5 0,15.5 Q4,10 4.5,3 Q5,-6 3,-15.5 Z" fill="#5e4c48" opacity=".35"/>
      <path d="M-7.2,-4.6 Q-3.8,-7.6 -0.6,-5 M0.8,-5 Q4,-7.6 7.4,-4.4" fill="none" stroke="#5a4844" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="-3.8" cy="-2.4" rx="2.3" ry="1.5" fill="#4e3e3b"/>
      <ellipse cx="4" cy="-2.4" rx="2.3" ry="1.5" fill="#4e3e3b"/>
      <path d="M0,-5 L-2.2,4.6 Q0,5.6 2.2,4.8 Z" fill="#f4e9e2"/>
      <path d="M0.2,-5 L2.6,4.8 L0.6,5.2 Z" fill="#5a4844" opacity=".7"/>
      <path d="M-3.4,8.6 Q0,9.8 3.6,8.4" fill="none" stroke="#5a4844" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M-4,12.5 Q0,15 4.5,12.2" fill="none" stroke="#6e5c57" stroke-width=".7" opacity=".7"/>
    </g>
  </defs>

  <!-- 山壁主體 -->
  <path d="M3,104 L5,74 Q6,54 15,42 L26,30 Q40,18 58,21 L74,17 Q96,16 110,28 L120,44 Q125,60 124,104 Z" fill="url(#rmCliff)" stroke="#5f4f4b" stroke-width="1"/>
  <!-- 岩壁裂紋 -->
  <g fill="none" stroke="#6e5c57" stroke-width=".8" opacity=".55" stroke-linecap="round">
    <path d="M12,48 L16,62 L13,78"/>
    <path d="M60,24 L62,34"/>
    <path d="M114,40 L118,58 L115,74"/>
    <path d="M84,20 L86,30"/>
    <path d="M38,26 L34,36"/>
  </g>

  <!-- 羅斯福的凹槽（深陰影） -->
  <path d="M60,44 Q72,36 84,44 L86,82 Q73,90 60,82 Z" fill="#5c4b47" opacity=".75"/>

  <!-- 傑佛遜：在華盛頓後方，頭微傾 -->
  <g transform="translate(50,50) rotate(-14) scale(1.1)">
    <path d="M-9,-8 Q-6,-19 3,-17 Q-4,-15 -8,-6 Z" fill="#b9a59c"/>
    <use href="#rmHead"/>
  </g>

  <!-- 老羅斯福：凹入、圓眼鏡與八字鬍 -->
  <g transform="translate(73,62) scale(1.05)">
    <use href="#rmHead"/>
    <path d="M-9,-5 Q-10,-16 0,-16 Q10,-16 9.5,-5 L8.5,6 Q6.5,14.5 0,15.5 Q-6.5,14.5 -8.5,6 Z" fill="#4e3e3b" opacity=".18"/>
    <g fill="none" stroke="#3e302d" stroke-width="1.1">
      <circle cx="-3.8" cy="-2.4" r="3"/>
      <circle cx="4" cy="-2.4" r="3"/>
      <path d="M-0.8,-2.6 L1,-2.6"/>
    </g>
    <path d="M-5.4,6.4 Q-2.6,5 0,6.4 Q2.6,5 5.6,6.4 Q4,9.4 0,8.2 Q-4,9.4 -5.4,6.4 Z" fill="#6e5c57" stroke="#3e302d" stroke-width=".6"/>
  </g>

  <!-- 華盛頓：最前方，後腦有假髮捲 -->
  <g transform="translate(28,58) scale(1.22)">
    <path d="M-9.5,-6 Q-13,0 -10,8 Q-12,2 -8.6,-2 Z" fill="#a8958d" stroke="#6e5c57" stroke-width=".6"/>
    <use href="#rmHead"/>
    <path d="M-8.8,-6 Q-7,-14 1,-15.6" fill="none" stroke="#fff6ef" stroke-width="1" opacity=".6" stroke-linecap="round"/>
  </g>

  <!-- 林肯：右側，落腮鬍與凹陷臉頰 -->
  <g transform="translate(100,58) scale(1.22)">
    <use href="#rmHead"/>
    <path d="M-8.6,3 Q-8,13 0,16.5 Q8,13 8.8,3 Q7,9 4,10.6 Q0,12 -4,10.6 Q-7,9 -8.6,3 Z" fill="#8b7770" stroke="#5a4844" stroke-width=".7"/>
    <g stroke="#5a4844" stroke-width=".5" opacity=".7">
      <path d="M-6,8 L-5,12"/><path d="M-3,11 L-2.5,14.5"/><path d="M3,11 L2.6,14.5"/><path d="M6,8 L5,12"/>
    </g>
    <path d="M-6.6,1.5 Q-5.4,4.5 -6.4,7" fill="none" stroke="#6e5c57" stroke-width=".9"/>
    <path d="M6.6,1.5 Q5.4,4.5 6.4,7" fill="none" stroke="#5a4844" stroke-width=".9"/>
  </g>

  <!-- 碎石坡 -->
  <path d="M0,114 Q6,98 22,96 Q44,92 64,95 Q88,92 108,96 Q122,99 128,112 L128,118 L0,118 Z" fill="url(#rmTalus)" stroke="#6e5c57" stroke-width=".8"/>
  <g fill="#8e7c75" stroke="#6e5c57" stroke-width=".5">
    <ellipse cx="30" cy="102" rx="3" ry="1.6"/>
    <ellipse cx="52" cy="99" rx="2.4" ry="1.3"/>
    <ellipse cx="76" cy="100" rx="3.2" ry="1.6"/>
    <ellipse cx="96" cy="103" rx="2.6" ry="1.4"/>
    <ellipse cx="64" cy="106" rx="2" ry="1.1"/>
  </g>

  <!-- 松樹 -->
  <g fill="url(#rmPine)" stroke="#1c3d22" stroke-width=".8" stroke-linejoin="round">
    <path d="M8,120 L14,98 L20,120 Z"/>
    <path d="M18,122 L25,102 L32,122 Z"/>
    <path d="M38,122 L44,106 L50,122 Z"/>
    <path d="M80,122 L86,105 L92,122 Z"/>
    <path d="M98,122 L105,100 L112,122 Z"/>
    <path d="M110,120 L116,97 L122,120 Z"/>
  </g>
  <path d="M2,121 Q64,116 126,121 Q126,125 64,125 Q2,125 2,121 Z" fill="#000" opacity=".15"/>
</svg>
