<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="chStone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfc6b4"/>
    <stop offset="1" stop-color="#9a9080"/>
  </linearGradient>
</defs>
<!-- 沙特爾大教堂：哥德式，兩座不對稱的尖塔（一座樸素尖頂、一座華麗火焰式） -->
<rect x="20" y="40" width="40" height="30" fill="url(#chStone)" stroke="#5c5448" stroke-width="0.5"/>
<!-- 玫瑰窗 -->
<circle cx="40" cy="46" r="6" fill="#4a6a8a" stroke="#5c5448" stroke-width="0.6"/>
<circle cx="40" cy="46" r="3" fill="#7a9ab8" opacity="0.7"/>
<!-- 中央大門 -->
<path d="M34,70 L34,60 Q40,55 46,60 L46,70 Z" fill="#5c5448" opacity="0.6"/>
<!-- 左塔：樸素石造尖頂 -->
<rect x="14" y="26" width="10" height="20" fill="url(#chStone)" stroke="#5c5448" stroke-width="0.5"/>
<polygon points="14,26 19,8 24,26" fill="#8a8070" stroke="#4a4438" stroke-width="0.5"/>
<!-- 右塔：華麗火焰式尖頂（較高、較細緻） -->
<rect x="56" y="20" width="9" height="26" fill="url(#chStone)" stroke="#5c5448" stroke-width="0.5"/>
<polygon points="56,20 60.5,4 65,20" fill="#8a8070" stroke="#4a4438" stroke-width="0.5"/>
<line x1="60.5" y1="4" x2="60.5" y2="1" stroke="#4a4438" stroke-width="1"/>
</svg>
