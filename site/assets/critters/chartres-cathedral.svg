<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 沙特爾大教堂：米白石灰岩西立面，左（北）塔為高而華麗的火焰式哥德尖塔、右（南）塔為較矮樸素的羅馬式八角尖頂；中央大玫瑰窗（藍紅彩繪玻璃）、下方三座拱門，後方為綠色銅鏽屋頂 -->
  <defs>
    <linearGradient id="chcStone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ecd6"/>
      <stop offset=".55" stop-color="#ddd1b4"/>
      <stop offset="1" stop-color="#b3a585"/>
    </linearGradient>
    <linearGradient id="chcStoneV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6cc"/>
      <stop offset="1" stop-color="#bfb193"/>
    </linearGradient>
    <linearGradient id="chcSpireL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9dfc4"/>
      <stop offset=".5" stop-color="#cdbf9f"/>
      <stop offset=".5" stop-color="#a8997a"/>
      <stop offset="1" stop-color="#8e8064"/>
    </linearGradient>
    <linearGradient id="chcSpireR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6cbb0"/>
      <stop offset=".5" stop-color="#bcae8f"/>
      <stop offset=".5" stop-color="#978a6d"/>
      <stop offset="1" stop-color="#7f735a"/>
    </linearGradient>
    <linearGradient id="chcCopper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd6bf"/>
      <stop offset="1" stop-color="#3f8f78"/>
    </linearGradient>
    <radialGradient id="chcRose" cx=".42" cy=".4" r=".65">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset=".2" stop-color="#e2453f"/>
      <stop offset=".5" stop-color="#2f5fc4"/>
      <stop offset=".8" stop-color="#1d3d8f"/>
      <stop offset="1" stop-color="#9b2440"/>
    </radialGradient>
    <linearGradient id="chcDoor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a3a"/>
      <stop offset="1" stop-color="#2e241b"/>
    </linearGradient>
  </defs>

  <!-- 地面陰影 -->
  <ellipse cx="40" cy="75" rx="27" ry="3.2" fill="#000" opacity=".22"/>

  <!-- 後方中殿綠色銅屋頂與飛扶壁 -->
  <polygon points="30,38 40,24.5 50,38" fill="url(#chcCopper)" stroke="#2d6656" stroke-width=".5"/>
  <path d="M59 50 L66 44 L66 72 L59 72Z" fill="#b8aa8b" stroke="#6b5f4c" stroke-width=".4"/>
  <path d="M59 54 Q63 48 66 46" fill="none" stroke="#8e8064" stroke-width="1"/>
  <path d="M21 50 L14 44 L14 72 L21 72Z" fill="#cfc2a3" stroke="#6b5f4c" stroke-width=".4"/>
  <path d="M21 54 Q17 48 14 46" fill="none" stroke="#a89978" stroke-width="1"/>

  <!-- 右（南）塔：樸素羅馬式八角尖頂 -->
  <polygon points="48.3,30 53,9 57.7,30" fill="url(#chcSpireR)" stroke="#5f5442" stroke-width=".5"/>
  <line x1="53" y1="9" x2="53" y2="30" stroke="#6f6450" stroke-width=".3"/>
  <polygon points="47,32 48,27 49,32" fill="#b3a585" stroke="#5f5442" stroke-width=".35"/>
  <polygon points="57,32 58,27 59,32" fill="#978a6d" stroke="#5f5442" stroke-width=".35"/>
  <rect x="47" y="31" width="12" height="43" fill="url(#chcStone)" stroke="#6b5f4c" stroke-width=".55"/>
  <rect x="51.3" y="35" width="3.4" height="7" rx="1.7" fill="#4b3f33"/>
  <rect x="51.6" y="47" width="2.8" height="6" rx="1.4" fill="#4b3f33"/>
  <line x1="47.8" y1="33" x2="47.8" y2="74" stroke="#fff8e6" stroke-width=".5" opacity=".7"/>
  <line x1="58" y1="33" x2="58" y2="74" stroke="#8e8064" stroke-width=".7"/>

  <!-- 左（北）塔：高聳華麗的火焰式哥德尖塔 -->
  <polygon points="24.4,16 27,1.5 29.6,16" fill="url(#chcSpireL)" stroke="#5f5442" stroke-width=".5"/>
  <g stroke="#6b5f4c" stroke-width=".35" fill="none">
    <path d="M25.2 13 L28.8 13 M25.7 10 L28.3 10 M26.2 7 L27.8 7 M26.6 4.5 L27.4 4.5"/>
  </g>
  <g fill="#efe6cc" stroke="#6b5f4c" stroke-width=".25">
    <circle cx="25" cy="12" r=".55"/><circle cx="29" cy="12" r=".55"/>
    <circle cx="25.6" cy="8.5" r=".5"/><circle cx="28.4" cy="8.5" r=".5"/>
    <circle cx="26.2" cy="5.5" r=".45"/><circle cx="27.8" cy="5.5" r=".45"/>
  </g>
  <circle cx="27" cy="1.6" r=".7" fill="#e7c95a" stroke="#7a6230" stroke-width=".25"/>
  <!-- 鏤空鐘樓層 -->
  <rect x="23.2" y="16" width="7.6" height="7" fill="url(#chcStone)" stroke="#6b5f4c" stroke-width=".45"/>
  <path d="M24.4 23 V18.6 Q25.2 17 26 18.6 V23Z M28 23 V18.6 Q28.8 17 29.6 18.6 V23Z" fill="#4b3f33"/>
  <polygon points="22.4,24 23.2,15 24,24" fill="#e9dfc4" stroke="#6b5f4c" stroke-width=".3"/>
  <polygon points="30,24 30.8,15 31.6,24" fill="#a8997a" stroke="#6b5f4c" stroke-width=".3"/>
  <rect x="21.8" y="23" width="10.4" height="7.5" fill="url(#chcStone)" stroke="#6b5f4c" stroke-width=".45"/>
  <path d="M23.3 30 V26.2 Q24.4 24 25.5 26.2 V30Z M28.5 30 V26.2 Q29.6 24 30.7 26.2 V30Z" fill="#4b3f33"/>
  <path d="M26.2 30 V26.6 Q27 25 27.8 26.6 V30Z" fill="#4b3f33"/>
  <polygon points="20.6,31 21.5,21.5 22.4,31" fill="#efe6cc" stroke="#6b5f4c" stroke-width=".3"/>
  <polygon points="31.6,31 32.5,21.5 33.4,31" fill="#b3a585" stroke="#6b5f4c" stroke-width=".3"/>
  <rect x="21" y="30" width="12" height="44" fill="url(#chcStone)" stroke="#6b5f4c" stroke-width=".55"/>
  <rect x="25.3" y="34" width="3.4" height="7" rx="1.7" fill="#4b3f33"/>
  <rect x="25.6" y="46" width="2.8" height="6" rx="1.4" fill="#4b3f33"/>
  <line x1="21.8" y1="32" x2="21.8" y2="74" stroke="#fff8e6" stroke-width=".5" opacity=".8"/>
  <line x1="32" y1="32" x2="32" y2="74" stroke="#a89978" stroke-width=".7"/>

  <!-- 中央立面與山牆 -->
  <polygon points="33,37 40,29 47,37" fill="url(#chcStoneV)" stroke="#6b5f4c" stroke-width=".5"/>
  <circle cx="40" cy="33.8" r="1" fill="#4b3f33"/>
  <rect x="33" y="36.5" width="14" height="37.5" fill="url(#chcStoneV)" stroke="#6b5f4c" stroke-width=".55"/>
  <!-- 國王廊 -->
  <rect x="33" y="37" width="14" height="2.4" fill="#d7caa9" stroke="#6b5f4c" stroke-width=".3"/>
  <path d="M34 39.4 V38 M35.5 39.4 V38 M37 39.4 V38 M38.5 39.4 V38 M40 39.4 V38 M41.5 39.4 V38 M43 39.4 V38 M44.5 39.4 V38 M46 39.4 V38" stroke="#6b5f4c" stroke-width=".35"/>

  <!-- 玫瑰窗 -->
  <circle cx="40" cy="46" r="6.3" fill="#d7caa9" stroke="#6b5f4c" stroke-width=".5"/>
  <circle cx="40" cy="46" r="5.4" fill="url(#chcRose)" stroke="#3b3326" stroke-width=".4"/>
  <g stroke="#e9dfc4" stroke-width=".35">
    <line x1="40" y1="40.6" x2="40" y2="51.4"/>
    <line x1="34.6" y1="46" x2="45.4" y2="46"/>
    <line x1="36.2" y1="42.2" x2="43.8" y2="49.8"/>
    <line x1="43.8" y1="42.2" x2="36.2" y2="49.8"/>
    <line x1="37.9" y1="41" x2="42.1" y2="51"/>
    <line x1="42.1" y1="41" x2="37.9" y2="51"/>
    <line x1="35" y1="43.9" x2="45" y2="48.1"/>
    <line x1="45" y1="43.9" x2="35" y2="48.1"/>
  </g>
  <circle cx="40" cy="46" r="3.6" fill="none" stroke="#e9dfc4" stroke-width=".35"/>
  <circle cx="40" cy="46" r="1.3" fill="#f2c94c" stroke="#e9dfc4" stroke-width=".3"/>
  <g fill="#e2453f">
    <circle cx="40" cy="41.6" r=".55"/><circle cx="40" cy="50.4" r=".55"/>
    <circle cx="35.6" cy="46" r=".55"/><circle cx="44.4" cy="46" r=".55"/>
  </g>
  <ellipse cx="38" cy="43.6" rx="1.6" ry="1" fill="#fff" opacity=".4">
    <animate attributeName="opacity" values=".15;.6;.15" dur="3.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 三扇尖頂長窗 -->
  <g fill="#2f5fc4" stroke="#3b3326" stroke-width=".3">
    <path d="M35.4 61 V55.4 Q36.4 53.4 37.4 55.4 V61Z"/>
    <path d="M39 61 V55 Q40 52.8 41 55 V61Z"/>
    <path d="M42.6 61 V55.4 Q43.6 53.4 44.6 55.4 V61Z"/>
  </g>

  <!-- 三座拱門 -->
  <path d="M33.6 74 V67 Q35.5 62.8 37.2 67 V74Z" fill="url(#chcDoor)" stroke="#6b5f4c" stroke-width=".35"/>
  <path d="M37.8 74 V66 Q40 61.6 42.2 66 V74Z" fill="url(#chcDoor)" stroke="#6b5f4c" stroke-width=".35"/>
  <path d="M42.8 74 V67 Q44.5 62.8 46.4 67 V74Z" fill="url(#chcDoor)" stroke="#6b5f4c" stroke-width=".35"/>
  <rect x="19.5" y="73.4" width="41" height="1.6" rx=".5" fill="#a89978" stroke="#6b5f4c" stroke-width=".35"/>
</svg>
