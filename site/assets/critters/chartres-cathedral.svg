  <!-- 沙特爾大教堂（2.5D）：法國哥德式大教堂，西立面兩座不同的尖塔（左邊樸素的羅馬式、右邊較高的火焰哥德式），三座尖拱大門上方是彩繪玫瑰窗，中殿與後殿蓋著銅綠屋頂、側面一排飛扶壁；玫瑰窗透出光芒、鴿子繞著尖塔飛（動畫）。光源左上，不描邊 -->
