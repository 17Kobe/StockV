<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 西湖三潭印月：夜晚湖面上三座石造小塔（球形塔身開五個圓孔、頂有葫蘆塔剎、立於水中石座），孔中燭光與滿月倒映水面；左上垂柳，遠方低矮青山與雷峰塔剪影 -->
  <defs>
    <radialGradient id="wl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity=".75"/><stop offset=".55" stop-color="#ffe9a0" stop-opacity=".2"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wl-moon" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fffdf0"/><stop offset=".7" stop-color="#fbeab0"/><stop offset="1" stop-color="#eccf7c"/>
    </radialGradient>
    <linearGradient id="wl-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5f8c"/><stop offset="1" stop-color="#1a2d4e"/>
    </linearGradient>
    <linearGradient id="wl-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7d68"/><stop offset="1" stop-color="#2b4a46"/>
    </linearGradient>
    <radialGradient id="wl-stone" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ece6d4"/><stop offset=".6" stop-color="#b5ae9a"/><stop offset="1" stop-color="#77725f"/>
    </radialGradient>
    <linearGradient id="wl-stoneL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ddd6c2"/><stop offset="1" stop-color="#857e6a"/>
    </linearGradient>
    <radialGradient id="wl-hole" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff7c0"/><stop offset=".6" stop-color="#ffc84a"/><stop offset="1" stop-color="#e88a1e"/>
    </radialGradient>
    <!-- 單座石塔（底在 y=0） -->
    <g id="wl-lan" stroke="#4e4a3e" stroke-width="0.45" stroke-linejoin="round">
      <path d="M-3.6,0 L-3,-3 L3,-3 L3.6,0 Z" fill="url(#wl-stoneL)"/>
      <ellipse cx="0" cy="-3" rx="3" ry="0.8" fill="#d8d1bc"/>
      <rect x="-1.4" y="-5.6" width="2.8" height="2.6" fill="url(#wl-stoneL)"/>
      <circle cx="0" cy="-10.5" r="5.2" fill="url(#wl-stone)"/>
      <circle cx="0" cy="-10.5" r="1.15" fill="url(#wl-hole)" stroke="#5a3a1a" stroke-width="0.35"/>
      <ellipse cx="-3.2" cy="-10.6" rx="0.65" ry="1.05" fill="url(#wl-hole)" stroke="#5a3a1a" stroke-width="0.3"/>
      <ellipse cx="3.2" cy="-10.6" rx="0.65" ry="1.05" fill="url(#wl-hole)" stroke="#5a3a1a" stroke-width="0.3"/>
      <ellipse cx="0" cy="-15.8" rx="4.4" ry="1.1" fill="url(#wl-stoneL)"/>
      <ellipse cx="0" cy="-16.8" rx="2" ry="0.8" fill="#cfc8b2"/>
      <circle cx="0" cy="-18.6" r="1.35" fill="url(#wl-stone)"/>
      <circle cx="0" cy="-20.6" r="0.9" fill="url(#wl-stone)"/>
      <path d="M0,-21.5 L0,-22.8" stroke-width="0.6" stroke-linecap="round"/>
    </g>
    <!-- 孔光倒影 -->
    <g id="wl-refl">
      <path d="M-4.5,2.2 L4.5,2.2 M-3.5,4 L3.5,4 M-2.5,6 L2.5,6" stroke="#ffcf5a" stroke-width="0.7" stroke-linecap="round" opacity=".75"/>
      <path d="M-3.2,9.5 h0.9 M-0.5,9.8 h1 M2.4,9.5 h0.9" stroke="#ffd36a" stroke-width="0.8" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- 滿月 -->
  <circle cx="63" cy="15" r="15" fill="url(#wl-glow)"/>
  <circle cx="63" cy="15" r="8" fill="url(#wl-moon)" stroke="#d9b866" stroke-width="0.5"/>
  <circle cx="60.5" cy="13" r="1.4" fill="#efdca0" opacity=".6"/>
  <circle cx="65.5" cy="17.5" r="1" fill="#efdca0" opacity=".6"/>

  <!-- 遠山與雷峰塔 -->
  <path d="M3,50 Q10,43 18,45 Q26,39.5 35,43.5 Q44,41 50,44 Q58,40 66,44.5 Q72,44 77,50 Z" fill="url(#wl-hill)" stroke="#223c3a" stroke-width="0.5"/>
  <g fill="#24403e">
    <path d="M28.4,42 L28.4,38 L27.8,38 L29.2,36.6 L28.8,36.6 L28.8,34.2 L28.3,34.2 L29.6,32.8 L29.6,31.6 L30,30.6 L30.4,31.6 L30.4,32.8 L31.7,34.2 L31.2,34.2 L31.2,36.6 L30.8,36.6 L32.2,38 L31.6,38 L31.6,42 Z"/>
  </g>
  <circle cx="30" cy="35.4" r="0.35" fill="#ffd36a"/>

  <!-- 湖面 -->
  <path d="M2,50 Q40,45 78,50 L79,73 Q40,80 1,73 Z" fill="url(#wl-water)" stroke="#142440" stroke-width="0.6"/>
  <path d="M8,52 Q22,50 34,52" fill="none" stroke="#7fa2c8" stroke-width="0.4" opacity=".6"/>
  <!-- 月影 -->
  <g fill="#fff3c0">
    <ellipse cx="63" cy="52.5" rx="5" ry="0.6" opacity=".85"/>
    <ellipse cx="63.4" cy="55.5" rx="4" ry="0.55" opacity=".7"/>
    <ellipse cx="62.6" cy="59" rx="4.4" ry="0.55" opacity=".55"/>
    <ellipse cx="63.2" cy="63" rx="3" ry="0.5" opacity=".45"/>
    <ellipse cx="63" cy="67" rx="2.2" ry="0.45" opacity=".35"/>
    <animate attributeName="opacity" values="1;.7;1" dur="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- 石塔倒影 -->
  <g opacity=".13">
    <use href="#wl-lan" transform="translate(17,58) scale(.85,-.6)"/>
    <use href="#wl-lan" transform="translate(56,57) scale(.8,-.55)"/>
    <use href="#wl-lan" transform="translate(40,66) scale(1.25,-.5)"/>
  </g>
  <g>
    <use href="#wl-refl" transform="translate(17,58) scale(.85)"/>
    <use href="#wl-refl" transform="translate(56,57) scale(.8)"/>
    <use href="#wl-refl" transform="translate(40,66) scale(1.1,.8)"/>
    <animate attributeName="opacity" values="1;.6;1" dur="2.6s" repeatCount="indefinite"/>
  </g>

  <!-- 三座石塔 -->
  <use href="#wl-lan" transform="translate(17,58) scale(.85)"/>
  <use href="#wl-lan" transform="translate(56,57) scale(.8)"/>
  <use href="#wl-lan" transform="translate(40,66) scale(1.25)"/>
  <!-- 孔中燭光光暈 -->
  <g fill="#ffd36a" opacity=".35">
    <circle cx="17" cy="49" r="3"/><circle cx="56" cy="48.6" r="2.8"/><circle cx="40" cy="52.9" r="4"/>
    <animate attributeName="opacity" values=".35;.2;.35" dur="2.2s" repeatCount="indefinite"/>
  </g>

  <!-- 垂柳 -->
  <g fill="none" stroke-linecap="round">
    <path d="M0,6 Q10,2 22,6" stroke="#4a3424" stroke-width="1.4"/>
    <g stroke="#5f9a4a" stroke-width="0.9" stroke-dasharray="1.6 0.6">
      <path d="M3,5 Q2,16 4,28"/>
      <path d="M7,4 Q6.5,17 8.5,32"/>
      <path d="M11,3.6 Q11,15 12.6,26"/>
      <path d="M15,4 Q15.5,13 17,21"/>
      <path d="M19,5 Q19.6,11 20.6,16"/>
      <animateTransform attributeName="transform" type="rotate" values="0 10 4;1.5 10 4;0 10 4" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
