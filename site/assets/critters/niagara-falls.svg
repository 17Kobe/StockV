<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 尼加拉瀑布：寬闊的馬蹄形瀑布，崖頂水色帶綠，底部升起大片白色水霧與彩虹，下游河面有藍白色的「霧中少女號」遊船，兩側岩崖長著綠樹 -->
  <defs>
    <linearGradient id="nfRiver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb8a8"/>
      <stop offset="1" stop-color="#2f8a86"/>
    </linearGradient>
    <linearGradient id="nfFall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd0b8"/>
      <stop offset=".3" stop-color="#d8f4ec"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="nfSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cb09c"/>
      <stop offset=".4" stop-color="#b6e0d6"/>
      <stop offset="1" stop-color="#e8f6f2"/>
    </linearGradient>
    <linearGradient id="nfCliff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b09170"/>
      <stop offset="1" stop-color="#6e5440"/>
    </linearGradient>
    <linearGradient id="nfPool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc0c4"/>
      <stop offset="1" stop-color="#2f7f96"/>
    </linearGradient>
    <radialGradient id="nfMist" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nfLeaf" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#8fcc5a"/>
      <stop offset=".6" stop-color="#4f9a38"/>
      <stop offset="1" stop-color="#2c6326"/>
    </radialGradient>
    <linearGradient id="nfFaceH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9e8e"/>
      <stop offset=".22" stop-color="#bfe6dc"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".78" stop-color="#bfe6dc"/>
      <stop offset="1" stop-color="#4f9e8e"/>
    </linearGradient>
  </defs>

  <!-- 上游河面（馬蹄外側，由遠岸流向崖口） -->
  <path d="M0,40 C1,2 79,2 80,40 L74,46 C74,10 6,10 6,46 Z" fill="url(#nfRiver)" stroke="#2a6f68" stroke-width=".4"/>
  <g stroke="#9fe0cc" stroke-width=".5" fill="none" opacity=".8"><path d="M20,14 Q40,8 60,14"/><path d="M8,30 Q10,18 22,14"/><path d="M72,30 Q70,18 58,14"/></g>
  <!-- 遠岸樹林 -->
  <g fill="url(#nfLeaf)" stroke="#24502a" stroke-width=".5">
    <circle cx="22" cy="6" r="3.4"/><circle cx="30" cy="4" r="3.6"/><circle cx="40" cy="3.4" r="3.8"/><circle cx="50" cy="4" r="3.6"/><circle cx="58" cy="6" r="3.4"/>
  </g>

  <!-- 馬蹄形瀑布：U 形瀑布面，兩側較暗、中央受光 -->
  <path d="M6,46 C6,10 74,10 74,46 L72,64 C72,34 8,34 8,64 Z" fill="url(#nfFaceH)" stroke="#4a9484" stroke-width=".5"/>
  <path d="M6,46 C6,10 74,10 74,46 L73.4,50 C73,16 7,16 6.6,50 Z" fill="#3fa88a" opacity=".75"/>
  <path d="M6,46 C6,10 74,10 74,46" fill="none" stroke="#2f8a72" stroke-width=".9"/>
  <!-- 水流線條 -->
  <g stroke="#8fcfc0" stroke-width=".5" fill="none" opacity=".9">
    <path d="M7.3,37.8 L9.3,57.1"/><path d="M11.0,31.0 L12.7,51.5"/><path d="M16.6,25.8 L18.0,47.1"/><path d="M23.6,22.0 L24.6,44.0"/><path d="M31.6,19.7 L32.1,42.1"/><path d="M40.0,19.0 L40.0,41.5"/><path d="M48.4,19.8 L47.9,42.1"/><path d="M56.4,22.0 L55.4,44.0"/><path d="M63.4,25.8 L62.0,47.1"/><path d="M69.0,31.0 L67.3,51.5"/><path d="M72.7,37.8 L70.7,57.1"/>
    <animate attributeName="opacity" values=".9;.45;.9" dur="1.4s" repeatCount="indefinite"/>
  </g>

  <!-- 兩側岩崖與樹 -->
  <path d="M0,38 Q4,40 6.4,46 L8.4,66 L0,68 Z" fill="url(#nfCliff)" stroke="#4e3a2c" stroke-width=".5"/>
  <path d="M80,38 Q76,40 73.6,46 L71.6,66 L80,68 Z" fill="url(#nfCliff)" stroke="#4e3a2c" stroke-width=".5"/>
  <g fill="url(#nfLeaf)" stroke="#24502a" stroke-width=".5">
    <circle cx="2" cy="37" r="4.5"/><circle cx="6" cy="42" r="3"/>
    <circle cx="78" cy="37" r="4.5"/><circle cx="74" cy="42" r="3"/>
  </g>

  <!-- 下游河面 -->
  <path d="M0,62 Q40,56 80,62 L80,76 Q40,82 0,76 Z" fill="url(#nfPool)" stroke="#2a6a7e" stroke-width=".4"/>

  <!-- 彩虹 -->
  <g fill="none" stroke-width="1.1" opacity=".7">
    <path d="M16,62 Q40,30 64,62" stroke="#ff6b6b"/>
    <path d="M17.4,62 Q40,32.4 62.6,62" stroke="#ffd25a"/>
    <path d="M18.8,62 Q40,34.8 61.2,62" stroke="#6fd36f"/>
    <path d="M20.2,62 Q40,37.2 59.8,62" stroke="#6aa8ff"/>
  </g>

  <!-- 底部水霧 -->
  <g fill="url(#nfMist)">
    <ellipse cx="18" cy="58" rx="13" ry="7"/>
    <ellipse cx="40" cy="50" rx="16" ry="9"/>
    <ellipse cx="62" cy="58" rx="13" ry="7"/>
    <ellipse cx="30" cy="62" rx="14" ry="4.5"/>
    <ellipse cx="50" cy="62" rx="14" ry="4.5"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1.2;0,0" dur="3s" repeatCount="indefinite"/>
  </g>
  <g fill="#fff" opacity=".85">
    <circle cx="34" cy="43" r="3"/><circle cx="46" cy="44" r="2.5"/><circle cx="20" cy="51" r="2.2"/><circle cx="60" cy="51" r="2.2"/>
    <animate attributeName="opacity" values=".85;.4;.85" dur="2.6s" repeatCount="indefinite"/>
  </g>

  <!-- 霧中少女號 -->
  <g transform="translate(48,70)">
    <path d="M-9,0 L9,0 L7,3.6 L-7.5,3.6 Z" fill="#ffffff" stroke="#2a4a7a" stroke-width=".5"/>
    <path d="M-9,1.6 L9,1.6" stroke="#2c5aa8" stroke-width=".9"/>
    <path d="M-6,0 L-6,-3 L5,-3 L5,0 Z" fill="#2c5aa8" stroke="#1c3a6e" stroke-width=".4"/>
    <path d="M-4.5,-5 L3.5,-5 L3.5,-3 L-4.5,-3 Z" fill="#ffffff" stroke="#1c3a6e" stroke-width=".4"/>
    <path d="M-5,-2.2 H4" stroke="#bfe2ff" stroke-width=".7" stroke-dasharray="1 .6"/>
    <path d="M-12,4.6 Q0,6 12,4.6" fill="none" stroke="#e8fbff" stroke-width=".7" opacity=".8"/>
  </g>
  <g stroke="#e8fbff" stroke-width=".5" fill="none" opacity=".7">
    <path d="M8,72 Q14,71 20,72"/><path d="M60,76 Q66,75 72,76"/>
  </g>
</svg>
